<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EAR TUNE - ギター耳チューニングゲーム</title>
<style>
  :root {
    --bg: #14110f;
    --panel: #1f1a17;
    --panel-border: #382e27;
    --gold: #d9a05b;
    --gold-bright: #f5c378;
    --text: #f3ece4;
    --muted: #a39587;
    --good: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    margin: 0;
    padding: 12px;
    background: radial-gradient(circle at top, #261e19 0%, var(--bg) 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .app {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
  }

  .title-wrap h1 {
    margin: 0;
    font-size: 1.05rem;
    letter-spacing: 0.04em;
    color: var(--gold-bright);
  }

  .title-wrap p {
    margin: 2px 0 0;
    font-size: 0.72rem;
    color: var(--muted);
  }

  .header-actions {
    display: flex;
    gap: 6px;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    transition: transform 0.08s, background 0.15s, opacity 0.15s;
  }

  button:active {
    transform: scale(0.95);
  }

  .btn-secondary {
    background: #2f2722;
    color: var(--text);
    border: 1px solid #473b33;
    padding: 7px 10px;
    font-size: 0.78rem;
    font-weight: 600;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--gold), #b87c38);
    color: #1a120b;
    padding: 7px 12px;
    font-size: 0.8rem;
    font-weight: 800;
    box-shadow: 0 2px 8px rgba(217, 160, 91, 0.3);
  }

  .controls-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 8px 10px;
  }

  .mode-tabs {
    display: flex;
    gap: 4px;
    background: #14110f;
    padding: 3px;
    border-radius: 8px;
    flex: 1 1 auto;
  }

  .mode-btn {
    flex: 1;
    background: transparent;
    color: var(--muted);
    padding: 5px 6px;
    font-size: 0.72rem;
    font-weight: 600;
    border-radius: 6px;
    white-space: nowrap;
  }

  .mode-btn.active {
    background: #332a24;
    color: var(--gold-bright);
  }

  .toggles-row {
    display: flex;
    gap: 6px;
    width: 100%;
    justify-content: space-between;
    align-items: center;
  }

  .toggle-pill {
    background: #2a221d;
    color: var(--muted);
    border: 1px solid #3f342c;
    padding: 5px 9px;
    font-size: 0.72rem;
    border-radius: 20px;
  }

  .toggle-pill.active {
    background: #3d3025;
    color: var(--gold-bright);
    border-color: var(--gold);
  }

  .ref-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: #1b1714;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 0.78rem;
  }

  .ref-info {
    color: var(--muted);
    line-height: 1.3;
  }

  .ref-info strong {
    color: var(--text);
  }

  .ref-buttons {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .btn-ref {
    background: #2b3847;
    color: #bae6fd;
    border: 1px solid #3d5269;
    padding: 7px 11px;
    font-size: 0.76rem;
    font-weight: 700;
    border-radius: 8px;
  }

  .btn-ref.playing {
    background: #0284c7;
    color: #fff;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
  }

  .guitar-stage {
    position: relative;
    width: 100%;
    background: linear-gradient(180deg, #1b1613 0%, #110d0b 100%);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6);
  }

  svg#guitarSvg {
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
  }

  /* Peg Overlay Controls */
  .peg-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .peg-unit {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    gap: 4px;
    pointer-events: auto;
  }

  .peg-unit.left {
    flex-direction: row;
  }

  .peg-unit.right {
    flex-direction: row-reverse;
  }

  .peg-step-col {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .peg-step-btn {
    width: 26px;
    height: 22px;
    border-radius: 6px;
    background: #2b231e;
    border: 1px solid #4a3d34;
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }

  .peg-step-btn:hover {
    background: #3b3029;
  }

  .peg-knob {
    position: relative;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e7e5e4, #a8a29e 60%, #57534e 100%);
    border: 2px solid #292524;
    box-shadow: 0 4px 10px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.6);
    cursor: ns-resize;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .peg-knob.selected {
    box-shadow: 0 0 0 2px var(--gold-bright), 0 4px 12px rgba(217, 160, 91, 0.45);
  }

  .peg-wing {
    position: absolute;
    width: 40px;
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(180deg, #fafaf9 0%, #a8a29e 50%, #78716c 100%);
    border: 1px solid #44403c;
    pointer-events: none;
  }

  .peg-dot {
    position: absolute;
    top: 4px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #b45309;
  }

  .peg-label {
    position: absolute;
    bottom: -16px;
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--muted);
    background: rgba(20, 17, 15, 0.85);
    padding: 1px 5px;
    border-radius: 4px;
    pointer-events: none;
    white-space: nowrap;
  }

  .peg-unit.selected .peg-label {
    color: var(--gold-bright);
  }

  .practice-badge {
    position: absolute;
    top: -15px;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 4px;
    background: #14110f;
    border: 1px solid #44403c;
    white-space: nowrap;
    pointer-events: none;
  }

  .footer-hint {
    text-align: center;
    font-size: 0.72rem;
    color: var(--muted);
    padding: 4px 8px;
    line-height: 1.4;
  }

  /* Result Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 8, 7, 0.82);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal {
    width: 100%;
    max-width: 420px;
    background: #1f1a17;
    border: 1px solid var(--gold);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
  }

  .modal-header {
    text-align: center;
    margin-bottom: 12px;
  }

  .rank-badge {
    display: inline-block;
    font-size: 2rem;
    font-weight: 900;
    color: var(--gold-bright);
    line-height: 1;
  }

  .score-text {
    font-size: 0.9rem;
    color: var(--muted);
    margin-top: 4px;
  }

  .result-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
  }

  .result-row {
    display: grid;
    grid-template-columns: 44px 1fr 78px 66px;
    align-items: center;
    gap: 8px;
    background: #15110f;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 0.8rem;
  }

  .meter-track {
    height: 8px;
    background: #2b231e;
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }

  .meter-center {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #78716c;
    transform: translateX(-50%);
  }

  .meter-dot {
    position: absolute;
    top: 1px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    transform: translateX(-50%);
  }

  .modal-actions {
    display: flex;
    gap: 8px;
  }

  .modal-actions button {
    flex: 1;
    padding: 10px;
    font-size: 0.84rem;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="title-wrap">
      <h1>🎸 EAR TUNE</h1>
      <p>耳だけで合わせるギターチューニング</p>
    </div>
    <div class="header-actions">
      <button class="btn-secondary" id="shuffleBtn">シャッフル</button>
      <button class="btn-primary" id="checkBtn">判定する</button>
    </div>
  </header>

  <div class="controls-bar">
    <div class="mode-tabs" id="modeTabs">
      <button class="mode-btn active" data-mode="easy">お手本あり</button>
      <button class="mode-btn" data-mode="fret5">5F相対法</button>
      <button class="mode-btn" data-mode="master">A440音叉</button>
    </div>
    <div class="toggles-row">
      <button class="toggle-pill" id="fineToggle">微調整モード: OFF</button>
      <button class="toggle-pill" id="timbreToggle">音色: アコギ</button>
      <button class="toggle-pill" id="muteBtn">🔇 消音</button>
    </div>
  </div>

  <div class="ref-bar">
    <div class="ref-info" id="refInfo">
      <strong>選択中: 6弦 (E2)</strong><br>
      お手本と聴き比べてペグを回そう
    </div>
    <div class="ref-buttons">
      <button class="btn-ref" id="playRefBtn">🔊 お手本を鳴らす</button>
    </div>
  </div>

  <div class="guitar-stage" id="guitarStage">
    <svg id="guitarSvg" viewBox="0 0 420 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="headWood" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#3b261a"/>
          <stop offset="50%" stop-color="#271810"/>
          <stop offset="100%" stop-color="#190f0a"/>
        </linearGradient>
        <linearGradient id="neckWood" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#241710"/>
          <stop offset="50%" stop-color="#332117"/>
          <stop offset="100%" stop-color="#241710"/>
        </linearGradient>
        <linearGradient id="bodyWood" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5c351e"/>
          <stop offset="100%" stop-color="#331c0f"/>
        </linearGradient>
      </defs>

      <!-- Acoustic Body top edge at bottom -->
      <path d="M 35 435 Q 210 405 385 435 L 420 520 L 0 520 Z" fill="url(#bodyWood)" stroke="#231209" stroke-width="2"/>
      <!-- Soundhole & Rosette -->
      <circle cx="210" cy="488" r="66" fill="#0d0805" stroke="#c89250" stroke-width="3"/>
      <circle cx="210" cy="488" r="72" fill="none" stroke="#8c5b2b" stroke-width="1.5" stroke-dasharray="4 3"/>

      <!-- Headstock Silhouette -->
      <path d="M 135 235 L 116 195 L 112 36 Q 112 20 132 18 L 210 24 L 288 18 Q 308 20 308 36 L 304 195 L 285 235 Z"
            fill="url(#headWood)" stroke="#4a3122" stroke-width="2"/>

      <!-- Fretboard / Neck -->
      <polygon points="135,235 285,235 335,470 85,470" fill="url(#neckWood)" stroke="#170f0a" stroke-width="1.5"/>

      <!-- Fret wires (4F and 5F zone) -->
      <line x1="126" y1="275" x2="294" y2="275" stroke="#a8a29e" stroke-width="2" opacity="0.7"/>
      <line x1="118" y1="315" x2="302" y2="315" stroke="#a8a29e" stroke-width="2" opacity="0.7"/>
      <line x1="109" y1="355" x2="311" y2="355" stroke="#a8a29e" stroke-width="2" opacity="0.7"/>
      <line x1="100" y1="395" x2="320" y2="395" stroke="#a8a29e" stroke-width="2" opacity="0.7"/>
      <!-- Fret inlay dot -->
      <circle cx="210" cy="335" r="5" fill="#e7e5e4" opacity="0.35"/>

      <!-- Nut (Bone) -->
      <rect x="133" y="229" width="154" height="8" rx="2" fill="#f5efe6" stroke="#b8ab99" stroke-width="1"/>

      <!-- Tuner Posts inside headstock -->
      <g id="tunerPosts" fill="#d6d3d1" stroke="#57534e" stroke-width="2">
        <circle cx="142" cy="55" r="7"/>
        <circle cx="142" cy="120" r="7"/>
        <circle cx="142" cy="185" r="7"/>
        <circle cx="278" cy="55" r="7"/>
        <circle cx="278" cy="120" r="7"/>
        <circle cx="278" cy="185" r="7"/>
      </g>

      <!-- Strings (rendered dynamically) -->
      <g id="stringsLayer"></g>

      <!-- Fret press interactive buttons (4F/5F) -->
      <g id="fretButtonsLayer"></g>

      <!-- Invisible wider hit targets for plucking / strumming -->
      <g id="hitLayer"></g>
    </svg>

    <div class="peg-overlay" id="pegOverlay"></div>
  </div>

  <div class="footer-hint">
    💡 弦をタップ（または横になぞってストローク）で音を鳴らし、ペグを<strong>上下にドラッグ</strong>か<strong>＋/−をタップ</strong>して回します。<br>
    ネック上の「5F / 4F」を押すと、隣の弦との<strong>うなり</strong>を聴き比べられます！
  </div>
</div>

<!-- Result Modal -->
<div class="modal-backdrop" id="resultModal">
  <div class="modal">
    <div class="modal-header">
      <div class="rank-badge" id="rankBadge">S</div>
      <div class="score-text" id="scoreText">平均誤差: 2.1 cents / 96点</div>
    </div>
    <div class="result-list" id="resultList"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="practiceBtn">答えを見ながら調整</button>
      <button class="btn-primary" id="nextGameBtn">もう1回！(シャッフル)</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ===== String Definitions (6th E2 to 1st E4) =====
  const STRINGS = [
    { id: 0, label: '6E', full: '6弦 (E2)', targetFreq: 82.406889, gauge: 3.3, color: '#d49a6a', post: [142, 185], nutX: 150, bridgeX: 95,  pegPos: [62, 185],  side: 'left',  compareFret: 5 },
    { id: 1, label: '5A', full: '5弦 (A2)', targetFreq: 110.000000, gauge: 2.7, color: '#d9a477', post: [142, 120], nutX: 174, bridgeX: 141, pegPos: [62, 120],  side: 'left',  compareFret: 5 },
    { id: 2, label: '4D', full: '4弦 (D3)', targetFreq: 146.832384, gauge: 2.2, color: '#dfaf86', post: [142, 55],  nutX: 198, bridgeX: 187, pegPos: [62, 55],   side: 'left',  compareFret: 5 },
    { id: 3, label: '3G', full: '3弦 (G3)', targetFreq: 195.997718, gauge: 1.7, color: '#e5e7eb', post: [278, 55],  nutX: 222, bridgeX: 233, pegPos: [358, 55],  side: 'right', compareFret: 4 },
    { id: 4, label: '2B', full: '2弦 (B3)', targetFreq: 246.941651, gauge: 1.4, color: '#f3f4f6', post: [278, 120], nutX: 246, bridgeX: 279, pegPos: [358, 120], side: 'right', compareFret: 5 },
    { id: 5, label: '1E', full: '1弦 (E4)', targetFreq: 329.627557, gauge: 1.1, color: '#ffffff', post: [278, 185], nutX: 270, bridgeX: 325, pegPos: [358, 185], side: 'right', compareFret: 0 }
  ];

  const MAX_CENTS = 220;

  // ===== State =====
  const state = {
    mode: 'easy',        // 'easy' | 'fret5' | 'master'
    fineMode: false,
    timbre: 'guitar',    // 'guitar' | 'sine'
    practicePeek: false,
    selectedIdx: 0,
    cents: [0, 0, 0, 0, 0, 0],
    pegAngles: [0, 0, 0, 0, 0, 0],
    fretted: [false, false, false, false, false, false],
    vibAmp: [0, 0, 0, 0, 0, 0],
    vibPhase: [0, 0, 0, 0, 0, 0],
    lastPluckTime: [0, 0, 0, 0, 0, 0]
  };

  // ===== Web Audio Engine =====
  let audioCtx = null;
  let masterGain = null;
  const activeVoices = new Array(6).fill(null);
  let refVoice = null;

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.7;

      // Subtle warm acoustic body EQ
      const bodyEQ = audioCtx.createBiquadFilter();
      bodyEQ.type = 'peaking';
      bodyEQ.frequency.value = 190;
      bodyEQ.Q.value = 1.2;
      bodyEQ.gain.value = 3.5;

      // Soft limiter / compressor
      const comp = audioCtx.createDynamicsCompressor();
      comp.threshold.value = -10;
      comp.ratio.value = 4;

      masterGain.connect(bodyEQ);
      bodyEQ.connect(comp);
      comp.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function getStringFreq(idx) {
    const s = STRINGS[idx];
    const openFreq = s.targetFreq * Math.pow(2, state.cents[idx] / 1200);
    const fret = state.fretted[idx] ? s.compareFret : 0;
    return openFreq * Math.pow(2, fret / 12);
  }

  function stopVoice(voice, fadeSec = 0.03) {
    if (!voice || !audioCtx) return;
    const now = audioCtx.currentTime;
    try {
      voice.gainNode.gain.cancelScheduledValues(now);
      voice.gainNode.gain.setValueAtTime(Math.max(voice.gainNode.gain.value, 0.0001), now);
      voice.gainNode.gain.exponentialRampToValueAtTime(0.0001, now + fadeSec);
      setTimeout(() => {
        voice.oscs.forEach(o => { try { o.stop(); o.disconnect(); } catch {} });
        try { voice.gainNode.disconnect(); } catch {}
      }, fadeSec * 1000 + 30);
    } catch {}
  }

  function pluckString(idx) {
    ensureAudio();
    const now = audioCtx.currentTime;
    state.selectedIdx = idx;
    state.vibAmp[idx] = 8.5;
    state.lastPluckTime[idx] = performance.now();
    updateSelectionUI();

    if (activeVoices[idx]) {
      stopVoice(activeVoices[idx], 0.025);
      activeVoices[idx] = null;
    }

    const baseFreq = getStringFreq(idx);
    const voiceGain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';

    const oscs = [];
    const multipliers = state.timbre === 'sine'
      ? [1]
      : [1, 2, 3, 4, 5, 6];
    const harmonicAmps = state.timbre === 'sine'
      ? [0.65]
      : (idx <= 2 ? [0.48, 0.45, 0.30, 0.20, 0.10, 0.05] : [0.58, 0.38, 0.22, 0.12, 0.06, 0.02]);

    multipliers.forEach((mult, i) => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(baseFreq * mult, now);
      g.gain.value = harmonicAmps[i];
      osc.connect(g);
      g.connect(filter);
      osc.start(now);
      oscs.push({ osc, mult });
    });

    // Pluck brightness sweep
    if (state.timbre === 'guitar') {
      filter.frequency.setValueAtTime(Math.min(baseFreq * 14, 4200), now);
      filter.frequency.exponentialRampToValueAtTime(Math.max(baseFreq * 2.8, 380), now + 0.75);

      // Subtle pick transient
      const bufSize = Math.floor(audioCtx.sampleRate * 0.018);
      const noiseBuf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.35));
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuf;
      const nFilter = audioCtx.createBiquadFilter();
      nFilter.type = 'bandpass';
      nFilter.frequency.value = 1800;
      const nGain = audioCtx.createGain();
      nGain.gain.value = 0.14;
      noise.connect(nFilter);
      nFilter.connect(nGain);
      nGain.connect(masterGain);
      noise.start(now);
    } else {
      filter.frequency.value = 6000;
    }

    // Sustain envelope (long enough to turn peg and listen for beats!)
    const sustainSec = idx <= 2 ? 5.8 : 4.6;
    voiceGain.gain.setValueAtTime(0.001, now);
    voiceGain.gain.linearRampToValueAtTime(0.5, now + 0.008);
    voiceGain.gain.exponentialRampToValueAtTime(0.0008, now + sustainSec);

    filter.connect(voiceGain);
    voiceGain.connect(masterGain);

    const voice = {
      oscs: oscs.map(o => o.osc),
      pairs: oscs,
      gainNode: voiceGain,
      expiresAt: now + sustainSec
    };
    activeVoices[idx] = voice;

    setTimeout(() => {
      if (activeVoices[idx] === voice) {
        voice.oscs.forEach(o => { try { o.stop(); o.disconnect(); } catch {} });
        try { voice.gainNode.disconnect(); } catch {}
        activeVoices[idx] = null;
      }
    }, sustainSec * 1000 + 60);
  }

  function updateRingingPitch(idx) {
    const voice = activeVoices[idx];
    if (!voice || !audioCtx) return;
    const now = audioCtx.currentTime;
    if (now >= voice.expiresAt) return;
    const f = getStringFreq(idx);
    voice.pairs.forEach(({ osc, mult }) => {
      osc.frequency.setTargetAtTime(f * mult, now, 0.015);
    });
  }

  function playReferenceTone() {
    ensureAudio();
    const btn = document.getElementById('playRefBtn');

    if (refVoice) {
      stopVoice(refVoice, 0.05);
      refVoice = null;
      btn.classList.remove('playing');
      updateRefText();
      return;
    }

    let freq = 440;
    let isFork = false;
    if (state.mode === 'easy') {
      freq = STRINGS[state.selectedIdx].targetFreq;
    } else if (state.mode === 'fret5') {
      freq = STRINGS[0].targetFreq; // 6th string E2
    } else {
      freq = 440.0; // A440 Tuning Fork
      isFork = true;
    }

    const now = audioCtx.currentTime;
    const gain = audioCtx.createGain();
    const oscs = [];

    if (isFork || state.timbre === 'sine') {
      const o = audioCtx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq, now);
      o.connect(gain);
      o.start(now);
      oscs.push(o);
    } else {
      [1, 2, 3, 4].forEach((m, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(freq * m, now);
        g.gain.value = [0.55, 0.35, 0.18, 0.08][i];
        o.connect(g);
        g.connect(gain);
        o.start(now);
        oscs.push(o);
      });
    }

    const dur = 4.5;
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.38, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0008, now + dur);
    gain.connect(masterGain);

    refVoice = { oscs, gainNode: gain };
    btn.classList.add('playing');
    btn.textContent = '⏹ 基準音を止める';

    setTimeout(() => {
      if (refVoice && refVoice.gainNode === gain) {
        oscs.forEach(o => { try { o.stop(); o.disconnect(); } catch {} });
        try { gain.disconnect(); } catch {}
        refVoice = null;
        btn.classList.remove('playing');
        updateRefText();
      }
    }, dur * 1000 + 50);
  }

  function muteAll() {
    for (let i = 0; i < 6; i++) {
      if (activeVoices[i]) {
        stopVoice(activeVoices[i], 0.04);
        activeVoices[i] = null;
      }
      state.vibAmp[i] = 0;
    }
    if (refVoice) {
      stopVoice(refVoice, 0.04);
      refVoice = null;
      document.getElementById('playRefBtn').classList.remove('playing');
      updateRefText();
    }
  }

  // ===== Pitch / Peg Adjustment =====
  function adjustCents(idx, deltaCents) {
    const next = Math.max(-MAX_CENTS, Math.min(MAX_CENTS, state.cents[idx] + deltaCents));
    const applied = next - state.cents[idx];
    state.cents[idx] = next;
    // Rotate peg visually (~3 degrees per cent)
    const dir = STRINGS[idx].side === 'left' ? -1 : 1;
    state.pegAngles[idx] += applied * 3.0 * dir;
    updatePegVisual(idx);
    updateRingingPitch(idx);
  }

  // ===== Build SVG & Interactive Pegs =====
  const stringsLayer = document.getElementById('stringsLayer');
  const fretButtonsLayer = document.getElementById('fretButtonsLayer');
  const hitLayer = document.getElementById('hitLayer');
  const pegOverlay = document.getElementById('pegOverlay');

  const stringPathEls = [];
  const pegKnobEls = [];
  const pegWingEls = [];
  const pegUnitEls = [];
  const pegBadgeEls = [];
  const fretCircleEls = [];

  function initBoard() {
    stringsLayer.innerHTML = '';
    fretButtonsLayer.innerHTML = '';
    hitLayer.innerHTML = '';
    pegOverlay.innerHTML = '';

    let isStrumming = false;

    window.addEventListener('pointerup', () => { isStrumming = false; });
    window.addEventListener('pointercancel', () => { isStrumming = false; });

    STRINGS.forEach((s, idx) => {
      // 1. Headstock segment (post to nut)
      const headLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      headLine.setAttribute('x1', s.post[0]);
      headLine.setAttribute('y1', s.post[1]);
      headLine.setAttribute('x2', s.nutX);
      headLine.setAttribute('y2', 233);
      headLine.setAttribute('stroke', s.color);
      headLine.setAttribute('stroke-width', s.gauge);
      headLine.setAttribute('stroke-linecap', 'round');
      stringsLayer.appendChild(headLine);

      // 2. Neck/Body vibrating segment (nut to bottom)
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M ${s.nutX} 233 Q ${(s.nutX + s.bridgeX) / 2} 376 ${s.bridgeX} 520`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', s.color);
      path.setAttribute('stroke-width', s.gauge);
      stringsLayer.appendChild(path);
      stringPathEls[idx] = path;

      // 3. Fret comparison button (5F or 4F on 3G)
      if (s.compareFret > 0) {
        const fretY = s.compareFret === 5 ? 335 : 295;
        const t = (fretY - 233) / (520 - 233);
        const fretX = s.nutX + (s.bridgeX - s.nutX) * t;

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.style.cursor = 'pointer';

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', fretX);
        circle.setAttribute('cy', fretY);
        circle.setAttribute('r', 12);
        circle.setAttribute('fill', '#261e19');
        circle.setAttribute('stroke', '#78716c');
        circle.setAttribute('stroke-width', '1.5');

        const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        txt.setAttribute('x', fretX);
        txt.setAttribute('y', fretY + 3.5);
        txt.setAttribute('text-anchor', 'middle');
        txt.setAttribute('font-size', '9');
        txt.setAttribute('font-weight', 'bold');
        txt.setAttribute('fill', '#d6d3d1');
        txt.textContent = s.compareFret + 'F';

        g.appendChild(circle);
        g.appendChild(txt);
        g.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          state.fretted[idx] = !state.fretted[idx];
          updateFretVisual(idx);
          updateRingingPitch(idx);
          pluckString(idx);
        });
        fretButtonsLayer.appendChild(g);
        fretCircleEls[idx] = { circle, txt };
      }

      // 4. Hit area for plucking / strumming (lower pluck zone y=360..520)
      const hitPoly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      const halfW = 22;
      const topX = s.nutX + (s.bridgeX - s.nutX) * ((360 - 233) / (520 - 233));
      hitPoly.setAttribute('points', `${topX - 15},355 ${topX + 15},355 ${s.bridgeX + halfW},520 ${s.bridgeX - halfW},520`);
      hitPoly.setAttribute('fill', 'transparent');
      hitPoly.style.cursor = 'pointer';

      hitPoly.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        isStrumming = true;
        pluckString(idx);
      });
      hitPoly.addEventListener('pointerenter', () => {
        if (isStrumming && performance.now() - state.lastPluckTime[idx] > 110) {
          pluckString(idx);
        }
      });
      hitLayer.appendChild(hitPoly);

      // 5. Peg Overlay Unit
      const unit = document.createElement('div');
      unit.className = `peg-unit ${s.side}`;
      unit.style.left = `${(s.pegPos[0] / 420) * 100}%`;
      unit.style.top = `${(s.pegPos[1] / 520) * 100}%`;

      const stepCol = document.createElement('div');
      stepCol.className = 'peg-step-col';

      const plusBtn = document.createElement('button');
      plusBtn.className = 'peg-step-btn';
      plusBtn.textContent = '＋';
      plusBtn.title = '締める (音を高く)';

      const minusBtn = document.createElement('button');
      minusBtn.className = 'peg-step-btn';
      minusBtn.textContent = '−';
      minusBtn.title = 'ゆるめる (音を低く)';

      attachHoldAction(plusBtn, idx, +1);
      attachHoldAction(minusBtn, idx, -1);
      stepCol.appendChild(plusBtn);
      stepCol.appendChild(minusBtn);

      const knob = document.createElement('div');
      knob.className = 'peg-knob';

      const wing = document.createElement('div');
      wing.className = 'peg-wing';
      const dot = document.createElement('div');
      dot.className = 'peg-dot';
      wing.appendChild(dot);

      const lbl = document.createElement('div');
      lbl.className = 'peg-label';
      lbl.textContent = s.label;

      const badge = document.createElement('div');
      badge.className = 'practice-badge';
      badge.style.display = 'none';

      knob.appendChild(wing);
      knob.appendChild(lbl);
      knob.appendChild(badge);

      // Drag / Wheel on Peg Knob
      let dragging = false;
      let lastY = 0;

      knob.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        knob.setPointerCapture(e.pointerId);
        dragging = true;
        lastY = e.clientY;
        state.selectedIdx = idx;
        updateSelectionUI();
        ensureAudio();
      });

      knob.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dy = lastY - e.clientY;
        lastY = e.clientY;
        if (dy !== 0) {
          const sens = state.fineMode ? 0.22 : 0.75;
          adjustCents(idx, dy * sens);
        }
      });

      const endDrag = (e) => {
        if (dragging) {
          dragging = false;
          try { knob.releasePointerCapture(e.pointerId); } catch {}
        }
      };
      knob.addEventListener('pointerup', endDrag);
      knob.addEventListener('pointercancel', endDrag);

      knob.addEventListener('wheel', (e) => {
        e.preventDefault();
        state.selectedIdx = idx;
        updateSelectionUI();
        const sens = state.fineMode ? 0.4 : 2.0;
        adjustCents(idx, (e.deltaY < 0 ? 1 : -1) * sens);
      }, { passive: false });

      unit.appendChild(stepCol);
      unit.appendChild(knob);
      pegOverlay.appendChild(unit);

      pegUnitEls[idx] = unit;
      pegKnobEls[idx] = knob;
      pegWingEls[idx] = wing;
      pegBadgeEls[idx] = badge;
    });

    // Enable mobile touch-move strumming across hitLayer
    const svgEl = document.getElementById('guitarSvg');
    svgEl.addEventListener('touchmove', (e) => {
      if (!isStrumming || !e.touches.length) return;
      const touch = e.touches[0];
      const rect = svgEl.getBoundingClientRect();
      const svgX = ((touch.clientX - rect.left) / rect.width) * 420;
      const svgY = ((touch.clientY - rect.top) / rect.height) * 520;
      if (svgY < 350) return;

      STRINGS.forEach((s, idx) => {
        const t = (svgY - 233) / (520 - 233);
        const sx = s.nutX + (s.bridgeX - s.nutX) * t;
        if (Math.abs(svgX - sx) < 18 && performance.now() - state.lastPluckTime[idx] > 120) {
          pluckString(idx);
        }
      });
    }, { passive: true });
  }

  function attachHoldAction(btn, idx, sign) {
    let timer = null;
    let interval = null;

    const step = () => {
      state.selectedIdx = idx;
      updateSelectionUI();
      const amount = state.fineMode ? 0.25 : 1.5;
      adjustCents(idx, sign * amount);
    };

    const stop = () => {
      clearTimeout(timer);
      clearInterval(interval);
      timer = null;
      interval = null;
    };

    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      ensureAudio();
      step();
      timer = setTimeout(() => {
        interval = setInterval(step, 55);
      }, 260);
    });

    btn.addEventListener('pointerup', stop);
    btn.addEventListener('pointerleave', stop);
    btn.addEventListener('pointercancel', stop);
  }

  // ===== UI Updates =====
  function updatePegVisual(idx) {
    pegWingEls[idx].style.transform = `rotate(${state.pegAngles[idx]}deg)`;
    const badge = pegBadgeEls[idx];
    if (state.practicePeek) {
      const c = state.cents[idx];
      const sign = c >= 0 ? '+' : '';
      badge.style.display = 'block';
      badge.textContent = `${sign}${c.toFixed(1)}¢`;
      const abs = Math.abs(c);
      badge.style.color = abs <= 2.5 ? 'var(--good)' : abs <= 8 ? 'var(--warn)' : 'var(--bad)';
    } else {
      badge.style.display = 'none';
    }
  }

  function updateFretVisual(idx) {
    const el = fretCircleEls[idx];
    if (!el) return;
    if (state.fretted[idx]) {
      el.circle.setAttribute('fill', '#d9a05b');
      el.circle.setAttribute('stroke', '#fef08a');
      el.txt.setAttribute('fill', '#14110f');
    } else {
      el.circle.setAttribute('fill', '#261e19');
      el.circle.setAttribute('stroke', '#78716c');
      el.txt.setAttribute('fill', '#d6d3d1');
    }
  }

  function updateSelectionUI() {
    STRINGS.forEach((_, idx) => {
      const sel = idx === state.selectedIdx;
      pegUnitEls[idx].classList.toggle('selected', sel);
      pegKnobEls[idx].classList.toggle('selected', sel);
    });
    updateRefText();
  }

  function updateRefText() {
    const info = document.getElementById('refInfo');
    const btn = document.getElementById('playRefBtn');
    const s = STRINGS[state.selectedIdx];

    if (state.mode === 'easy') {
      info.innerHTML = `<strong>選択中: ${s.full}</strong><br>お手本と聴き比べてペグを回そう`;
      if (!refVoice) btn.textContent = `🔊 ${s.label} のお手本`;
    } else if (state.mode === 'fret5') {
      info.innerHTML = `<strong>5フレット相対法 (選択: ${s.full})</strong><br>6弦を基準に、5F(3弦は4F)でうなりを消そう`;
      if (!refVoice) btn.textContent = `🔊 6弦基準音 (E2)`;
    } else {
      info.innerHTML = `<strong>Master (A440音叉のみ)</strong><br>440Hzの音叉を頼りに5弦(A)から合わせよう`;
      if (!refVoice) btn.textContent = `🔔 音叉 440Hz`;
    }
  }

  // ===== Game Flow & Grading =====
  function shuffleStrings() {
    muteAll();
    state.practicePeek = false;
    state.fretted.fill(false);

    STRINGS.forEach((_, idx) => {
      if (state.mode === 'fret5' && idx === 0) {
        // In 5-fret mode, start 6th string close or slightly off? Let's detune it too since E2 ref is given!
        // Actually giving E2 ref + detuned 6th string is full experience.
      }
      const sign = Math.random() < 0.5 ? -1 : 1;
      const offset = sign * (30 + Math.random() * 95); // ±30 to ±125 cents
      state.cents[idx] = offset;
      state.pegAngles[idx] = Math.random() * 360;
      updatePegVisual(idx);
      updateFretVisual(idx);
    });
    updateSelectionUI();
  }

  function showResults() {
    const list = document.getElementById('resultList');
    list.innerHTML = '';

    let totalAbs = 0;
    STRINGS.forEach((s, idx) => {
      const c = state.cents[idx];
      const abs = Math.abs(c);
      totalAbs += abs;

      let status = 'ズレ';
      let color = 'var(--bad)';
      if (abs <= 2.0) { status = '神耳!!'; color = 'var(--good)'; }
      else if (abs <= 5.0) { status = '合格!'; color = '#86efac'; }
      else if (abs <= 12.0) { status = '惜しい'; color = 'var(--warn)'; }

      const pct = Math.max(4, Math.min(96, 50 + (c / 60) * 50));
      const sign = c >= 0 ? '+' : '';

      const row = document.createElement('div');
      row.className = 'result-row';
      row.innerHTML = `
        <strong style="color:var(--gold-bright)">${s.label}</strong>
        <div class="meter-track">
          <div class="meter-center"></div>
          <div class="meter-dot" style="left:${pct}%; background:${color};"></div>
        </div>
        <span style="text-align:right; font-variant-numeric:tabular-nums;">${sign}${c.toFixed(1)} ¢</span>
        <span style="text-align:right; font-weight:700; color:${color};">${status}</span>
      `;
      list.appendChild(row);
    });

    const avg = totalAbs / 6;
    const score = Math.max(0, Math.round(100 - avg * 2.2));
    let rank = 'C';
    if (avg <= 2.0) rank = 'S+ (絶対音感級)';
    else if (avg <= 4.5) rank = 'S (プロ級)';
    else if (avg <= 8.5) rank = 'A (ナイス耳)';
    else if (avg <= 16.0) rank = 'B (あと少し)';

    document.getElementById('rankBadge').textContent = rank;
    document.getElementById('scoreText').textContent = `平均誤差: ${avg.toFixed(1)} cents ／ スコア: ${score}点`;
    document.getElementById('resultModal').classList.add('open');
  }

  // ===== String Vibration Animation Loop =====
  function animateStrings() {
    STRINGS.forEach((s, idx) => {
      const amp = state.vibAmp[idx];
      const midX = (s.nutX + s.bridgeX) / 2;
      if (amp > 0.08) {
        state.vibPhase[idx] += 0.75 + idx * 0.14;
        const dx = Math.sin(state.vibPhase[idx]) * amp;
        stringPathEls[idx].setAttribute('d', `M ${s.nutX} 233 Q ${midX + dx} 376 ${s.bridgeX} 520`);
        state.vibAmp[idx] *= 0.965;
      } else if (amp !== 0) {
        state.vibAmp[idx] = 0;
        stringPathEls[idx].setAttribute('d', `M ${s.nutX} 233 Q ${midX} 376 ${s.bridgeX} 520`);
      }
    });
    requestAnimationFrame(animateStrings);
  }

  // ===== Event Bindings =====
  document.getElementById('modeTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.mode-btn');
    if (!btn) return;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.mode = btn.dataset.mode;
    shuffleStrings();
  });

  document.getElementById('fineToggle').addEventListener('click', (e) => {
    state.fineMode = !state.fineMode;
    e.target.classList.toggle('active', state.fineMode);
    e.target.textContent = `微調整モード: ${state.fineMode ? 'ON' : 'OFF'}`;
  });

  document.getElementById('timbreToggle').addEventListener('click', (e) => {
    state.timbre = state.timbre === 'guitar' ? 'sine' : 'guitar';
    e.target.classList.toggle('active', state.timbre === 'sine');
    e.target.textContent = `音色: ${state.timbre === 'guitar' ? 'アコギ' : 'ピュア音(Sine)'}`;
  });

  document.getElementById('muteBtn').addEventListener('click', muteAll);
  document.getElementById('playRefBtn').addEventListener('click', playReferenceTone);
  document.getElementById('shuffleBtn').addEventListener('click', shuffleStrings);
  document.getElementById('checkBtn').addEventListener('click', showResults);

  document.getElementById('practiceBtn').addEventListener('click', () => {
    state.practicePeek = true;
    STRINGS.forEach((_, idx) => updatePegVisual(idx));
    document.getElementById('resultModal').classList.remove('open');
  });

  document.getElementById('nextGameBtn').addEventListener('click', () => {
    document.getElementById('resultModal').classList.remove('open');
    shuffleStrings();
  });

  document.getElementById('resultModal').addEventListener('click', (e) => {
    if (e.target.id === 'resultModal') {
      e.target.classList.remove('open');
    }
  });

  // Keyboard shortcuts (6~1 keys to pluck strings)
  window.addEventListener('keydown', (e) => {
    if (['6', '5', '4', '3', '2', '1'].includes(e.key)) {
      const idx = 6 - parseInt(e.key, 10);
      pluckString(idx);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      adjustCents(state.selectedIdx, state.fineMode ? 0.25 : 1.5);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      adjustCents(state.selectedIdx, state.fineMode ? -0.25 : -1.5);
    }
  });

  // Start!
  initBoard();
  shuffleStrings();
  requestAnimationFrame(animateStrings);
})();
</script>
</body>
</html>
