      };
      img.src = URL.createObjectURL(f); e.target.value = '';
    });

    // AI 360 Scan
    function appendAlignedMultiSlice(gw, gh, rgbGrid, smoothD, quat) {
      modelGroup.visible = false; xrCloudGroup.visible = false; multiCloudGroup.visible = true;
      const isRoom = state.scanMode === 'room';
      const fovRad = THREE.MathUtils.degToRad(55), focal = (gh / 2) / Math.tan(fovRad / 2);
      const depthScale = isRoom ? 1.45 : 0.65;
      const curZ = new Float32Array(gw * gh);
      for (let i = 0; i < gw * gh; i++) curZ[i] = depthScale / (smoothD[i] + 0.25);

      let scaleA = 1.0;
      if (state.prevMultiData) {
        const prev = state.prevMultiData, relQ = prev.quat.clone().invert().multiply(quat);
        const sP = [], sC = [], ray = new THREE.Vector3();
        for (let gy = 8; gy < gh - 8; gy += 6) {
          for (let gx = 8; gx < gw - 8; gx += 6) {
            const idx = gy * gw + gx; if (smoothD[idx] < 0.06) continue;
            ray.set((gx - gw / 2) / focal, -(gy - gh / 2) / focal, -1).normalize().applyQuaternion(relQ);
            if (ray.z >= -0.2) continue;
            const px = Math.round((ray.x / -ray.z) * focal + gw / 2), py = Math.round((-ray.y / -ray.z) * focal + gh / 2);
            if (px >= 2 && px < gw - 2 && py >= 2 && py < gh - 2 && prev.zGrid[py * gw + px] > 0.2) {
              sP.push(prev.zGrid[py * gw + px]); sC.push(curZ[idx]);
            }
          }
        }
        if (sC.length >= 16) {
          const ratios = sC.map((c, k) => sP[k] / c).sort((a, b) => a - b);
          scaleA = Math.max(0.55, Math.min(1.8, ratios[Math.floor(ratios.length / 2)]));
        }
      }

      const alignedZ = new Float32Array(gw * gh), pos = [], col = [], v = new THREE.Vector3();
      const voxRes = isRoom ? 33 : 80;
      for (let gy = 1; gy < gh - 1; gy++) {
        for (let gx = 1; gx < gw - 1; gx++) {
          const idx = gy * gw + gx, zM = curZ[idx] * scaleA;
          alignedZ[idx] = zM;
          if (smoothD[idx] < (isRoom ? 0.04 : 0.25)) continue;
          const d0 = smoothD[idx];
          if (Math.abs(d0 - smoothD[idx - 1]) > 0.07 || Math.abs(d0 - smoothD[idx + 1]) > 0.07 ||
              Math.abs(d0 - smoothD[idx - gw]) > 0.07 || Math.abs(d0 - smoothD[idx + gw]) > 0.07) continue;
          if ((gx % 2) || (gy % 2)) continue;
          v.set(((gx - gw / 2) * zM) / focal, -((gy - gh / 2) * zM) / focal, -zM).applyQuaternion(quat);
          const vKey = `${Math.round(v.x * voxRes)},${Math.round(v.y * voxRes)},${Math.round(v.z * voxRes)}`;
          if (state.multiVoxelSet.has(vKey)) continue;
          state.multiVoxelSet.add(vKey);
          pos.push(v.x, v.y, v.z);
          col.push(rgbGrid[idx * 3] / 255, rgbGrid[idx * 3 + 1] / 255, rgbGrid[idx * 3 + 2] / 255);
        }
      }
      state.prevMultiData = { quat: quat.clone(), zGrid: alignedZ };
      if (pos.length > 0) {
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
        multiCloudGroup.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.02, vertexColors: true, sizeAttenuation: true })));
        state.multiPointsCount += pos.length / 3;
        document.getElementById('telPts').textContent = state.multiPointsCount.toLocaleString();
      }
    }

    async function multiScanCheckLoop() {
      if (state.multiScanActive && state.aiReady && !state.isScanning && state.cameraActive && video.videoWidth > 0) {
        const curQ = getRelativeWorldQuat();
        if (!state.lastMultiQuat || curQ.angleTo(state.lastMultiQuat) >= THREE.MathUtils.degToRad(10)) {
          state.isScanning = true;
          try {
            const cap = captureToCanvas(video, video.videoWidth, video.videoHeight, 320);
            const res = await inferDepth(cap.rgb, cap.w, cap.h);
            const gw = 128, gh = Math.max(72, Math.round(128 * (cap.h / cap.w)));
            const { rgbGrid, depthGrid } = resampleToGrid(cap.w, cap.h, cap.rgb, res.pw, res.ph, res.data, gw, gh);
            appendAlignedMultiSlice(gw, gh, rgbGrid, jointBilateralSmooth(depthGrid, rgbGrid, gw, gh, 1), curQ);
            state.lastMultiQuat = curQ;
          } catch (e) {} finally { state.isScanning = false; }
        }
      }
      setTimeout(multiScanCheckLoop, 220);
    }

    function toggleMultiScan(force) {
      const next = typeof force === 'boolean' ? force : !state.multiScanActive;
      const btn = document.getElementById('btnMultiScan');
      if (next) {
        if (!state.cameraActive) { showToast('カメラが必要です'); return; }
        if (!state.aiReady) { showToast('AIモデル読込中です。完了後に押してください'); return; }
        clearGroup(multiCloudGroup); state.multiVoxelSet.clear(); state.prevMultiData = null;
        state.lastMultiQuat = null; state.multiPointsCount = 0; resetGyroYaw();
        state.viewMode = 'multi'; state.multiScanActive = true;
        btn.classList.add('recording'); btn.textContent = '⏹ 完了・3Dへ';
        scanLaser.classList.add('scanning');
        configureViewerPanels('multi');
        showToast('ゆっくり周囲を回してください');
      } else {
        state.multiScanActive = false; btn.classList.remove('recording');
        setScanMode(state.scanMode); scanLaser.classList.remove('scanning');
        if (state.multiPointsCount > 0) {
          camera.position.set(0, 0.15, 0.1); controls.target.set(0, 0, -1.2); controls.update();
          switchTab('viewer');
        }
      }
    }
    document.getElementById('btnMultiScan').addEventListener('click', () => toggleMultiScan());

    // ---------------------------------------------------------
    // REAL WebXR AR LiDAR (Single direct requestSession!)
    // ---------------------------------------------------------
    let xrSession = null;
    let xrAutoCapture = false;
    let xrPendingSnap = false;
    let xrLockRequested = false;
    let xrTargetCenter = null;
    let xrHitTestSource = null;

    function startWebXRLiDAR() {
      if (!webxrSupported) {
        showBootError('WebXR immersive-ar に非対応のブラウザです。');
        return;
      }

      const preferRaw = document.getElementById('chkPreferRaw').checked;
      const depthOpts = {
        usagePreference: ['cpu-optimized'],
        dataFormatPreference: ['luminance-alpha', 'float32']
      };
      if (preferRaw) depthOpts.depthTypeRequest = ['raw', 'smooth'];

      // MUST call requestSession synchronously inside click handler (no prior awaits!)
      navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['local', 'depth-sensing'],
        optionalFeatures: ['camera-access', 'dom-overlay', 'hit-test'],
        depthSensing: depthOpts,
        domOverlay: { root: document.getElementById('xrOverlay') }
      }).then(onXRSessionStarted).catch(err => {
        const msg = `WebXR起動失敗: ${err.name} - ${err.message}`;
        showBootError(msg);
        showToast(msg, 3500);
      });
    }

    async function onXRSessionStarted(session) {
      xrSession = session;
      bootModal.classList.add('hidden');
      document.getElementById('xrOverlay').classList.add('active');
      document.getElementById('topbar').style.display = 'none';

      resetXRCloudData();
      modelGroup.visible = false;
      multiCloudGroup.visible = false;
      xrCloudGroup.visible = true;
      gridHelper.visible = false;
      xrTargetCenter = null;
      xrTargetMarker.visible = false;
      xrAutoCapture = false;
      xrPendingSnap = false;
      state.viewMode = 'xr';
      setScanMode(state.scanMode);

      const autoBtn = document.getElementById('btnXrToggleCapture');
      autoBtn.classList.remove('recording');
      autoBtn.textContent = '▶ 自動記録を開始';

      // Stop viewer loop cleanly before binding XR session
      renderer.setAnimationLoop(null);
      renderer.xr.enabled = true;
      renderer.xr.setReferenceSpaceType('local');

      try {
        await renderer.xr.setSession(xrSession);
      } catch (err) {
        showBootError('WebGL XRバインド失敗: ' + err.message);
        bootModal.classList.remove('hidden');
        document.getElementById('xrOverlay').classList.remove('active');
        document.getElementById('topbar').style.display = 'flex';
        renderer.xr.enabled = false;
        try { xrSession.end(); } catch (e) {}
        startViewerRenderLoop();
        return;
      }

      xrHitTestSource = null;
      try {
        const viewerSpace = await xrSession.requestReferenceSpace('viewer');
        if (xrSession.requestHitTestSource) {
          xrHitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });
        }
      } catch (e) {}

      const gl = renderer.getContext();
      let glBinding = null;
      try { glBinding = new XRWebGLBinding(xrSession, gl); } catch (e) {}

      const dw = 128, dh = 96;
      const srcFbo = gl.createFramebuffer(), dstFbo = gl.createFramebuffer(), dstRb = gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER, dstRb);
      gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA8, dw, dh);
      gl.bindFramebuffer(gl.FRAMEBUFFER, dstFbo);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, dstRb);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      const camPixels = new Uint8Array(dw * dh * 4);

      const invProj = new THREE.Matrix4(), viewMat = new THREE.Matrix4();
      const rayVec = new THREE.Vector3(), worldPt = new THREE.Vector3();
      const camPos = new THREE.Vector3(), lastCapCamPos = new THREE.Vector3();
      const camQuat = new THREE.Quaternion(), lastCapCamQuat = new THREE.Quaternion();
      let hasLastCapPose = false;
      const sessionStartTime = performance.now();
      let lastHudUpdate = 0, lastCapTime = 0;

      function getCenterDepthRobust(depthInfo) {
        const vals = [];
        for (let dy = -0.02; dy <= 0.021; dy += 0.01) {
          for (let dx = -0.02; dx <= 0.021; dx += 0.01) {
            const d = depthInfo.getDepthInMeters(0.5 + dx, 0.5 + dy);
            if (d > 0.05 && d < 12.0) vals.push(d);
          }
        }
        if (vals.length === 0) return 0;
        vals.sort((a, b) => a - b);
        return vals[Math.floor(vals.length / 2)];
      }

      xrSession.addEventListener('end', () => {
        renderer.setAnimationLoop(null);
        renderer.xr.enabled = false;
        gridHelper.visible = true;
        xrTargetMarker.visible = false;
        document.getElementById('xrOverlay').classList.remove('active');
        document.getElementById('topbar').style.display = 'flex';
        xrSession = null;
        xrHitTestSource = null;

        configureViewerPanels('xr');
        if (xrPtsCount > 0) {
          let sx = 0, sy = 0, sz = 0;
          for (let i = 0; i < xrPtsCount; i++) {
            sx += xrPositions[i * 3]; sy += xrPositions[i * 3 + 1]; sz += xrPositions[i * 3 + 2];
          }
          const cx = sx / xrPtsCount, cy = sy / xrPtsCount, cz = sz / xrPtsCount;
          for (let i = 0; i < xrPtsCount; i++) {
            xrPositions[i * 3] -= cx; xrPositions[i * 3 + 1] -= cy; xrPositions[i * 3 + 2] -= cz;
          }
          xrPosAttr.needsUpdate = true;
          xrGeo.computeBoundingSphere();

          if (state.scanMode === 'object' && xrPtsCount >= 80) {
            buildSurfaceNetsMeshFromXR(1);
            camera.position.set(0, 0.25, 0.85);
          } else {
            camera.position.set(0, 0.6, 2.2);
          }
          controls.target.set(0, 0, 0);
          controls.update();
          onViewerResize();
          switchTab('viewer');
        } else {
          // If user exited without scanning points, return to scanner view
          switchTab('scanner');
        }
        startViewerRenderLoop();
      });

      renderer.setAnimationLoop((time, frame) => {
        // Render Three.js XR scene FIRST so XR framebuffer stays untouched during render!
        renderer.render(scene, camera);

        if (!frame) return;
        const refSpace = renderer.xr.getReferenceSpace();
        const pose = refSpace ? frame.getViewerPose(refSpace) : null;
        if (!pose || pose.views.length === 0) return;

        const view = pose.views[0];
        const depthInfo = frame.getDepthInformation(view);
        viewMat.fromArray((depthInfo?.transform?.matrix) || view.transform.matrix);
        viewMat.decompose(camPos, camQuat, new THREE.Vector3());

        const scaleMul = parseFloat(document.getElementById('rngXrScale').value);
        const isObjMode = state.scanMode === 'object';
        const objRadius = parseFloat(document.getElementById('rngXrRadius').value);
        const objFloorCut = parseFloat(document.getElementById('rngXrFloor').value);
        const roomMaxDist = parseFloat(document.getElementById('rngXrMaxDist').value);

        if (xrTargetCenter) {
          xrTargetMarker.visible = isObjMode;
          markerSphere.scale.setScalar(objRadius / 0.45);
        }

        if (!depthInfo) return;

        const rawCenterD = getCenterDepthRobust(depthInfo) * scaleMul;

        let hitDist = null;
        if (xrHitTestSource) {
          const hits = frame.getHitTestResults(xrHitTestSource);
          if (hits.length > 0) {
            const hp = hits[0].getPose(refSpace);
            if (hp) {
              const p = hp.transform.position;
              hitDist = camPos.distanceTo(new THREE.Vector3(p.x, p.y, p.z));
            }
          }
        }

        if (xrLockRequested) {
          xrLockRequested = false;
          const useDist = (hitDist && hitDist > 0.12 && hitDist < 2.5) ? hitDist : rawCenterD;
          if (useDist > 0.12 && useDist < 2.5) {
            invProj.fromArray((depthInfo.projectionMatrix) || view.projectionMatrix).invert();
            rayVec.set(0, 0, -1).applyMatrix4(invProj);
            const iz = -rayVec.z;
            xrTargetCenter = new THREE.Vector3((rayVec.x / iz) * useDist, (rayVec.y / iz) * useDist, -useDist).applyMatrix4(viewMat);
            xrTargetMarker.position.copy(xrTargetCenter);
            xrTargetMarker.visible = true;
            showToast(`🎯 物体ロック (${useDist.toFixed(2)}m)`);
          } else {
            showToast('物体にもう少し近づいてロックしてください');
          }
        }

        const movedDist = hasLastCapPose ? camPos.distanceTo(lastCapCamPos) : 999;
        const rotatedDeg = hasLastCapPose ? THREE.MathUtils.radToDeg(camQuat.angleTo(lastCapCamQuat)) : 999;
        const warmedUp = (time - sessionStartTime) > 650;
        const depthTypeStr = xrSession.depthType ? xrSession.depthType.toUpperCase() : 'DEPTH';

        if (time - lastHudUpdate > 160) {
          lastHudUpdate = time;
          const moveTip = movedDist >= 0.025 ? '<span class="ok">視差OK</span>' : '<span class="warn">横移動で精度UP</span>';
          const lockInfo = isObjMode
            ? (xrTargetCenter ? '<span class="ok">対象ロック中</span>' : '<span class="warn">未ロック</span>')
            : '<span class="ok">部屋モード</span>';
          const hitStr = hitDist ? ` | Hit:${hitDist.toFixed(2)}m` : '';
          document.getElementById('xrStatus').innerHTML =
            `<strong>${depthTypeStr}</strong> 中央: <strong>${rawCenterD > 0 ? rawCenterD.toFixed(2) + 'm' : '不明'}</strong>${hitStr}<br>` +
            `${lockInfo} | ${moveTip} | 点数: <strong>${xrPtsCount.toLocaleString()}</strong>`;
        }

        const shouldRecord = xrPendingSnap || (
          xrAutoCapture && warmedUp && (time - lastCapTime > 120) && (movedDist >= 0.028 || rotatedDeg >= 8.0)
        );

        if (shouldRecord && xrPtsCount < MAX_XR_PTS - 1500) {
          xrPendingSnap = false;
          lastCapTime = time;
          lastCapCamPos.copy(camPos);
          lastCapCamQuat.copy(camQuat);
          hasLastCapPose = true;

          // Safely read camera image while preserving current GL framebuffer binding
          let hasColor = false;
          if (glBinding && view.camera) {
            const prevReadFbo = gl.getParameter(gl.READ_FRAMEBUFFER_BINDING);
            const prevDrawFbo = gl.getParameter(gl.DRAW_FRAMEBUFFER_BINDING);
            try {
              const camTex = glBinding.getCameraImage(view.camera);
              if (camTex) {
                gl.bindFramebuffer(gl.READ_FRAMEBUFFER, srcFbo);
                gl.framebufferTexture2D(gl.READ_FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, camTex, 0);
                gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, dstFbo);
                gl.blitFramebuffer(0, 0, view.camera.width, view.camera.height, 0, 0, dw, dh, gl.COLOR_BUFFER_BIT, gl.LINEAR);
                gl.bindFramebuffer(gl.READ_FRAMEBUFFER, dstFbo);
                gl.readPixels(0, 0, dw, dh, gl.RGBA, gl.UNSIGNED_BYTE, camPixels);
                hasColor = true;
              }
            } catch (e) {} finally {
              gl.bindFramebuffer(gl.READ_FRAMEBUFFER, prevReadFbo);
              gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, prevDrawFbo);
              renderer.resetState();
            }
          }

          invProj.fromArray((depthInfo.projectionMatrix) || view.projectionMatrix).invert();
          const minDist = isObjMode ? 0.14 : 0.35;
          const maxDist = isObjMode ? (xrTargetCenter ? 2.4 : 1.55) : roomMaxDist;
          const colsN = isObjMode ? 52 : 42, rowsN = isObjMode ? 40 : 32;
          const voxInv = isObjMode ? 110 : 33;

          const dGrid = new Float32Array(colsN * rowsN);
          for (let r = 0; r < rowsN; r++) {
            const ny = (r + 0.5) / rowsN;
            for (let c = 0; c < colsN; c++) {
              const nx = (c + 0.5) / colsN;
              const d = depthInfo.getDepthInMeters(nx, ny);
              dGrid[r * colsN + c] = (d && d > 0.05) ? d * scaleMul : 0;
            }
          }

          let added = 0;
          for (let r = 1; r < rowsN - 1; r++) {
            const ny = (r + 0.5) / rowsN;
            for (let c = 1; c < colsN - 1; c++) {
              const nx = (c + 0.5) / colsN;
              const idx = r * colsN + c;
              const distM = dGrid[idx];
              if (distM < minDist || distM > maxDist) continue;

              const dl = dGrid[idx - 1], dr = dGrid[idx + 1], du = dGrid[idx - colsN], dd = dGrid[idx + colsN];
              if (!dl || !dr || !du || !dd) continue;
              const maxRelJump = isObjMode ? 0.08 : 0.11;
              if (Math.abs(distM - dl) / distM > maxRelJump || Math.abs(distM - dr) / distM > maxRelJump ||
                  Math.abs(distM - du) / distM > maxRelJump || Math.abs(distM - dd) / distM > maxRelJump) continue;

              rayVec.set(2 * nx - 1, 1 - 2 * ny, -1).applyMatrix4(invProj);
              const invZ = -rayVec.z;
              if (invZ <= 1e-4) continue;
              worldPt.set((rayVec.x / invZ) * distM, (rayVec.y / invZ) * distM, -distM).applyMatrix4(viewMat);

              if (isObjMode && xrTargetCenter) {
                if (worldPt.distanceTo(xrTargetCenter) > objRadius) continue;
                if (worldPt.y < xrTargetCenter.y + objFloorCut) continue;
              }

              let cr, cg, cb;
              if (hasColor) {
                const cx = Math.min(dw - 1, Math.floor(nx * dw));
                const cy = Math.min(dh - 1, Math.floor((1 - ny) * dh));
                const pIdx = (cy * dw + cx) * 4;
                cr = camPixels[pIdx] / 255; cg = camPixels[pIdx + 1] / 255; cb = camPixels[pIdx + 2] / 255;
              } else {
                [cr, cg, cb] = depthToHeatColor(1 - Math.min(1, distM / maxDist));
              }

              const vx = Math.round(worldPt.x * voxInv), vy = Math.round(worldPt.y * voxInv), vz = Math.round(worldPt.z * voxInv);
              const key = `${vx},${vy},${vz}`;
              const existingIdx = xrVoxelToIndex.get(key);

              if (existingIdx !== undefined) {
                const h = Math.min(254, xrHits[existingIdx] + 1);
                xrHits[existingIdx] = h;
                const w = 1 / h;
                xrPositions[existingIdx * 3] += (worldPt.x - xrPositions[existingIdx * 3]) * w;
                xrPositions[existingIdx * 3 + 1] += (worldPt.y - xrPositions[existingIdx * 3 + 1]) * w;
                xrPositions[existingIdx * 3 + 2] += (worldPt.z - xrPositions[existingIdx * 3 + 2]) * w;
                xrColors[existingIdx * 3] += (cr - xrColors[existingIdx * 3]) * w;
                xrColors[existingIdx * 3 + 1] += (cg - xrColors[existingIdx * 3 + 1]) * w;
                xrColors[existingIdx * 3 + 2] += (cb - xrColors[existingIdx * 3 + 2]) * w;
              } else if (xrPtsCount < MAX_XR_PTS) {
                const p = xrPtsCount++;
                xrVoxelToIndex.set(key, p);
                xrHits[p] = 1;
                xrPositions[p * 3] = worldPt.x;
                xrPositions[p * 3 + 1] = worldPt.y;
                xrPositions[p * 3 + 2] = worldPt.z;
                xrColors[p * 3] = cr;
                xrColors[p * 3 + 1] = cg;
                xrColors[p * 3 + 2] = cb;
                added++;
              }
            }
          }

          if (added > 0 || xrPtsCount > 0) {
            xrGeo.setDrawRange(0, xrPtsCount);
            xrPosAttr.needsUpdate = true;
            xrColAttr.needsUpdate = true;
          }
        }
      });
    }

    document.getElementById('btnWebXRScan').addEventListener('click', startWebXRLiDAR);
    document.getElementById('btnStartWebXRDirect').addEventListener('click', startWebXRLiDAR);
    document.getElementById('btnXrSwitchMode').addEventListener('click', () => {
      setScanMode(state.scanMode === 'object' ? 'room' : 'object');
    });
    document.getElementById('btnXrLockTarget').addEventListener('click', () => { xrLockRequested = true; });
    document.getElementById('btnXrSnapShot').addEventListener('click', () => { xrPendingSnap = true; });
    document.getElementById('btnXrToggleCapture').addEventListener('click', (e) => {
      xrAutoCapture = !xrAutoCapture;
      e.target.classList.toggle('recording', xrAutoCapture);
      e.target.textContent = xrAutoCapture ? '⏺ 自動記録中' : '▶ 自動記録を開始';
    });
    document.getElementById('btnXrClear').addEventListener('click', () => {
      resetXRCloudData(); xrTargetCenter = null; xrTargetMarker.visible = false;
      showToast('点群をリセットしました');
    });
    document.getElementById('btnXrFinish').addEventListener('click', () => {
      if (xrSession) xrSession.end();
    });

    ['rngXrRadius', 'rngXrFloor', 'rngXrMaxDist', 'rngXrScale'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        document.getElementById('valXrRadius').textContent = document.getElementById('rngXrRadius').value + 'm';
        document.getElementById('valXrFloor').textContent = document.getElementById('rngXrFloor').value + 'm';
        document.getElementById('valXrMaxDist').textContent = document.getElementById('rngXrMaxDist').value + 'm';
        document.getElementById('valXrScale').textContent = parseFloat(document.getElementById('rngXrScale').value).toFixed(2) + 'x';
      });
    });

    // ---------------------------------------------------------
    // Viewer UI & Export
    // ---------------------------------------------------------
    document.querySelectorAll('[data-render]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-render]').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        state.renderStyle = btn.dataset.render;
        if (state.viewMode === 'single') buildSingle3DModel();
        else if (state.viewMode === 'xr') {
          if (state.renderStyle === 'points') {
            modelGroup.visible = false; xrCloudGroup.visible = true;
          } else if (state.xrBuiltMesh) {
            buildSurfaceNetsMeshFromXR(parseInt(document.getElementById('rngMinHits').value, 10));
          }
        }
      });
    });

    ['rngDepthScale', 'rngSmooth', 'rngBgCut', 'rngThickness'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        document.getElementById('valDepthScale').textContent = document.getElementById('rngDepthScale').value;
        document.getElementById('valSmooth').textContent = document.getElementById('rngSmooth').value;
        document.getElementById('valBgCut').textContent = document.getElementById('rngBgCut').value + '%';
        document.getElementById('valThickness').textContent = document.getElementById('rngThickness').value;
        if (state.viewMode === 'single') buildSingle3DModel();
      });
    });

    document.getElementById('rngPtSize').addEventListener('input', (e) => {
      const sz = parseFloat(e.target.value);
      document.getElementById('valPtSize').textContent = (sz * 100).toFixed(1) + 'cm';
      xrPointsMat.size = sz;
      multiCloudGroup.children.forEach(c => { if (c.material) c.material.size = sz; });
    });

    document.getElementById('rngMinHits').addEventListener('input', (e) => {
      const mh = parseInt(e.target.value, 10);
      document.getElementById('valMinHits').textContent = `${mh}回以上`;
      if (state.viewMode === 'xr' && state.xrBuiltMesh) buildSurfaceNetsMeshFromXR(mh);
    });

    document.getElementById('btnXrBuildMesh').addEventListener('click', () => {
      buildSurfaceNetsMeshFromXR(parseInt(document.getElementById('rngMinHits').value, 10));
    });

    document.getElementById('btnCropToggle').addEventListener('click', (e) => {
      state.cropForeground = !state.cropForeground;
      e.target.classList.toggle('on', state.cropForeground);
      buildSingle3DModel();
    });

    document.getElementById('btnGyroOrbit').addEventListener('click', (e) => {
      state.gyroOrbit = !state.gyroOrbit;
      e.target.classList.toggle('on', state.gyroOrbit);
      e.target.textContent = state.gyroOrbit ? '📱 ジャイロ ON' : '📱 ジャイロ OFF';
    });

    function downloadBlob(blob, name) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    function buildCleanExportObject() {
      if (state.viewMode === 'xr' && !state.xrBuiltMesh) {
        const mh = parseInt(document.getElementById('rngMinHits').value, 10);
        const pos = [], col = [];
        for (let i = 0; i < xrPtsCount; i++) {
          if (xrHits[i] < mh) continue;
          pos.push(xrPositions[i * 3], xrPositions[i * 3 + 1], xrPositions[i * 3 + 2]);
          col.push(xrColors[i * 3], xrColors[i * 3 + 1], xrColors[i * 3 + 2]);
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
        const grp = new THREE.Group();
        grp.add(new THREE.Points(g, xrPointsMat));
        return { grp, temp: true };
      }
      if (state.viewMode === 'multi') return { grp: multiCloudGroup, temp: false };
      return { grp: modelGroup, temp: false };
    }

    document.getElementById('btnExportGLB').addEventListener('click', async () => {
      const { grp, temp } = buildCleanExportObject();
      if (grp.children.length === 0) { showToast('先にスキャンしてください'); return; }
      showToast('GLB生成中...');
      const exporter = new GLTFExporter();
      const glb = await exporter.parseAsync(grp, { binary: true });
      if (temp) clearGroup(grp);
      downloadBlob(new Blob([glb], { type: 'model/gltf-binary' }), `lidar-${state.scanMode}-${Date.now()}.glb`);
      showToast('GLBを保存しました！');
    });

    document.getElementById('btnExportPLY').addEventListener('click', () => {
      const { grp, temp } = buildCleanExportObject();
      if (grp.children.length === 0) { showToast('先にスキャンしてください'); return; }
      const verts = [], faces = [];
      let vOff = 0;
      for (const ch of grp.children) {
        const pos = ch.geometry?.getAttribute('position');
        const col = ch.geometry?.getAttribute('color');
        const idx = ch.geometry?.getIndex();
        if (!pos) continue;
        for (let i = 0; i < pos.count; i++) {
          const r = col ? Math.round(col.getX(i) * 255) : 0;
          const g = col ? Math.round(col.getY(i) * 255) : 240;
          const b = col ? Math.round(col.getZ(i) * 255) : 255;
          verts.push(`${pos.getX(i).toFixed(4)} ${pos.getY(i).toFixed(4)} ${pos.getZ(i).toFixed(4)} ${r} ${g} ${b}`);
        }
        if (idx && ch.isMesh) {
          for (let i = 0; i < idx.count; i += 3) {
            faces.push(`3 ${idx.getX(i) + vOff} ${idx.getX(i + 1) + vOff} ${idx.getX(i + 2) + vOff}`);
          }
        }
        vOff += pos.count;
      }
      if (temp) clearGroup(grp);
      const hdr = [
        'ply', 'format ascii 1.0', `element vertex ${verts.length}`,
        'property float x', 'property float y', 'property float z',
        'property uchar red', 'property uchar green', 'property uchar blue',
        ...(faces.length ? [`element face ${faces.length}`, 'property list uchar int vertex_indices'] : []),
        'end_header'
      ].join('\n');
      downloadBlob(new Blob([hdr + '\n' + verts.join('\n') + (faces.length ? '\n' + faces.join('\n') : '')], { type: 'text/plain' }), `lidar-${state.scanMode}-${Date.now()}.ply`);
      showToast('PLYを保存しました！');
    });

    function startViewerRenderLoop() {
      renderer.setAnimationLoop(() => {
        if (viewerView.classList.contains('active') && !renderer.xr.isPresenting) {
          if (state.gyroOrbit && state.gyroAvailable) {
            modelGroup.quaternion.slerp(getRelativeWorldQuat().invert(), 0.15);
          } else {
            modelGroup.quaternion.slerp(new THREE.Quaternion(), 0.15);
          }
          controls.update();
          renderer.render(scene, camera);
        }
      });
    }
    startViewerRenderLoop();
  </script>
</body>
</html>
