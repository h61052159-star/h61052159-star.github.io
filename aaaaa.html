      });
    }

    async function onXRSessionStarted(session) {
      xrSession = session;
      bootModal.classList.add('hidden');
      document.getElementById('xrOverlay').classList.add('active');
      document.getElementById('topbar').style.display = 'none';

      resetXRCloudData();
      modelGroup.visible = false;
      multiCloudGroup.visible = false;
      xrCloudGroup.visible = true;
      gridHelper.visible = false;
      xrAutoCapture = false;
      xrPendingSnap = false;
      xrAiBusy = false;
      xrAiJobsDone = 0;
      xrDetections = [];
      xrLockedTarget = null;
      xrLockedWorldPos = null;
      document.getElementById('btnXrClearLock').style.display = 'none';
      state.viewMode = 'xr';
      setScanMode(state.scanMode);

      const autoBtn = document.getElementById('btnXrToggleCapture');
      autoBtn.classList.remove('recording');
      autoBtn.textContent = '▶ 移動で自動AIスキャン';

      renderer.setAnimationLoop(null);
      renderer.xr.enabled = true;
      renderer.xr.setReferenceSpaceType('local');

      try {
        await renderer.xr.setSession(xrSession);
      } catch (err) {
        showBootError('WebGL XRバインド失敗: ' + err.message);
        bootModal.classList.remove('hidden');
        document.getElementById('xrOverlay').classList.remove('active');
        document.getElementById('topbar').style.display = 'flex';
        renderer.xr.enabled = false;
        try { xrSession.end(); } catch (e) {}
        startViewerRenderLoop();
        return;
      }

      // Switch MediaPipe detector to IMAGE mode for XR frame detection
      ensureDetectorMode('IMAGE');

      xrHitTestSource = null;
      try {
        const viewerSpace = await xrSession.requestReferenceSpace('viewer');
        if (xrSession.requestHitTestSource) {
          xrHitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });
        }
      } catch (e) {}

      const gl = renderer.getContext();
      let glBinding = null;
      try { glBinding = new XRWebGLBinding(xrSession, gl); } catch (e) {}

      // Offscreen FBO for grabbing AR camera texture -> upright RGBA
      let fboW = 0, fboH = 0;
      let srcFbo = null, dstFbo = null, dstRb = null, rawBuf = null, topDownRgba = null;
      const mpCanvas = document.createElement('canvas');
      const mpCtx = mpCanvas.getContext('2d');
      const pipCanvas = document.getElementById('xrPreviewPip');
      const pipCtx = pipCanvas.getContext('2d');

      function ensureCameraFBO(camW, camH) {
        const scale = Math.min(1, 320 / Math.max(camW, camH));
        const dw = Math.max(64, Math.round((camW * scale) / 2) * 2);
        const dh = Math.max(64, Math.round((camH * scale) / 2) * 2);
        if (dw === fboW && dh === fboH) return;
        fboW = dw; fboH = dh;
        if (!srcFbo) srcFbo = gl.createFramebuffer();
        if (!dstFbo) dstFbo = gl.createFramebuffer();
        if (!dstRb) dstRb = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, dstRb);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA8, dw, dh);
        gl.bindFramebuffer(gl.FRAMEBUFFER, dstFbo);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, dstRb);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        rawBuf = new Uint8Array(dw * dh * 4);
        topDownRgba = new Uint8ClampedArray(dw * dh * 4);
        mpCanvas.width = dw; mpCanvas.height = dh;
      }

      function grabUprightCameraPixels(view) {
        if (!glBinding || !view.camera) return false;
        const camW = view.camera.width, camH = view.camera.height;
        if (!camW || !camH) return false;
        ensureCameraFBO(camW, camH);

        const prevReadFbo = gl.getParameter(gl.READ_FRAMEBUFFER_BINDING);
        const prevDrawFbo = gl.getParameter(gl.DRAW_FRAMEBUFFER_BINDING);
        let ok = false;
        try {
          const camTex = glBinding.getCameraImage(view.camera);
          if (camTex) {
            gl.bindFramebuffer(gl.READ_FRAMEBUFFER, srcFbo);
            gl.framebufferTexture2D(gl.READ_FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, camTex, 0);
            gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, dstFbo);
            gl.blitFramebuffer(0, 0, camW, camH, 0, 0, fboW, fboH, gl.COLOR_BUFFER_BIT, gl.LINEAR);
            gl.bindFramebuffer(gl.READ_FRAMEBUFFER, dstFbo);
            gl.readPixels(0, 0, fboW, fboH, gl.RGBA, gl.UNSIGNED_BYTE, rawBuf);
            ok = true;
          }
        } catch (e) {} finally {
          gl.bindFramebuffer(gl.READ_FRAMEBUFFER, prevReadFbo);
          gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, prevDrawFbo);
          renderer.resetState();
        }
        if (!ok) return false;

        // Flip Y (WebGL bottom-up -> top-down image) & force opaque alpha
        const rowBytes = fboW * 4;
        for (let y = 0; y < fboH; y++) {
          const srcOff = (fboH - 1 - y) * rowBytes;
          const dstOff = y * rowBytes;
          for (let x = 0; x < rowBytes; x += 4) {
            topDownRgba[dstOff + x] = rawBuf[srcOff + x];
            topDownRgba[dstOff + x + 1] = rawBuf[srcOff + x + 1];
            topDownRgba[dstOff + x + 2] = rawBuf[srcOff + x + 2];
            topDownRgba[dstOff + x + 3] = 255;
          }
        }
        return true;
      }

      const invProj = new THREE.Matrix4(), viewMat = new THREE.Matrix4();
      const rayVec = new THREE.Vector3(), worldPt = new THREE.Vector3();
      const camPos = new THREE.Vector3(), lastCapCamPos = new THREE.Vector3();
      const camQuat = new THREE.Quaternion(), lastCapCamQuat = new THREE.Quaternion();
      let hasLastCapPose = false;
      let lastHudUpdate = 0, lastDetTime = 0, lastScanTriggerTime = 0;

      // Project AI depth result (latched to exact capture pose!) into XR 3D world
      function insertHybridAISlice(aiResult, latch) {
        const { gw, gh, rgbaCopy, capturedViewMat, capturedProjMat, depthSamples, hitDist, scaleMul, targetSnap, scanModeSnap } = latch;
        const rawResampled = resampleRawDepth(aiResult.pw, aiResult.ph, aiResult.data, gw, gh, false);
        const smoothAI = jointBilateralSmooth(rawResampled, rgbaCopy, gw, gh, 2, true);

        const calib = calibrateAIDepthToMeters(smoothAI, gw, gh, depthSamples, hitDist, scaleMul);
        const isObj = scanModeSnap === 'object';
        const minDist = isObj ? 0.14 : 0.35;
        const maxDist = isObj ? 2.2 : parseFloat(document.getElementById('rngXrMaxDist').value);
        const objRadius = parseFloat(document.getElementById('rngXrRadius').value);
        const voxInv = isObj ? 105 : 34; // ~0.95cm object, ~3cm room

        const invP = new THREE.Matrix4().fromArray(capturedProjMat).invert();

        // Compute depth in meters per pixel
        const zGrid = new Float32Array(gw * gh);
        for (let i = 0; i < gw * gh; i++) {
          const invZ = calib.a * smoothAI[i] + calib.b;
          zGrid[i] = (invZ > 0.08) ? (1.0 / invZ) : 99.0;
        }

        // If object mode with target tap/box, compute/reuse 3D anchor & foreground depth filter
        let refObjZ = null;
        if (isObj && targetSnap) {
          const tx = targetSnap.tapNorm ? Math.round(targetSnap.tapNorm.x * (gw - 1))
            : Math.round(((targetSnap.boxNorm.xmin + targetSnap.boxNorm.xmax) * 0.5) * (gw - 1));
          const ty = targetSnap.tapNorm ? Math.round(targetSnap.tapNorm.y * (gh - 1))
            : Math.round(((targetSnap.boxNorm.ymin + targetSnap.boxNorm.ymax) * 0.5) * (gh - 1));
          const tz = zGrid[Math.max(0, Math.min(gh - 1, ty)) * gw + Math.max(0, Math.min(gw - 1, tx))];
          if (tz > 0.14 && tz < 2.5) {
            refObjZ = tz;
            if (!xrLockedWorldPos) {
              const nx = tx / (gw - 1), ny = ty / (gh - 1);
              rayVec.set(2 * nx - 1, 1 - 2 * ny, -1).applyMatrix4(invP);
              const iz = -rayVec.z;
              if (iz > 1e-4) {
                xrLockedWorldPos = new THREE.Vector3((rayVec.x / iz) * tz, (rayVec.y / iz) * tz, -tz).applyMatrix4(capturedViewMat);
              }
            }
          }
        }

        let added = 0;
        const step = isObj ? 2 : 3;
        for (let gy = 2; gy < gh - 2; gy += step) {
          const ny = gy / (gh - 1);
          for (let gx = 2; gx < gw - 2; gx += step) {
            const nx = gx / (gw - 1);
            const idx = gy * gw + gx;
            const distM = zGrid[idx];
            if (distM < minDist || distM > maxDist) continue;

            // Object bounding box filter
            if (isObj && targetSnap?.boxNorm) {
              const pad = 0.05;
              if (nx < targetSnap.boxNorm.xmin - pad || nx > targetSnap.boxNorm.xmax + pad ||
                  ny < targetSnap.boxNorm.ymin - pad || ny > targetSnap.boxNorm.ymax + pad) continue;
            }
            if (isObj && refObjZ !== null && Math.abs(distM - refObjZ) > objRadius * 0.9) continue;

            // Flying-pixel gradient filter on smooth AI depth!
            const dl = zGrid[idx - 1], dr = zGrid[idx + 1], du = zGrid[idx - gw], dd = zGrid[idx + gw];
            if (Math.abs(distM - dl) / distM > 0.055 || Math.abs(distM - dr) / distM > 0.055 ||
                Math.abs(distM - du) / distM > 0.055 || Math.abs(distM - dd) / distM > 0.055) continue;

            rayVec.set(2 * nx - 1, 1 - 2 * ny, -1).applyMatrix4(invP);
            const iz = -rayVec.z;
            if (iz <= 1e-4) continue;
            worldPt.set((rayVec.x / iz) * distM, (rayVec.y / iz) * distM, -distM).applyMatrix4(capturedViewMat);

            if (isObj && xrLockedWorldPos && worldPt.distanceTo(xrLockedWorldPos) > objRadius) continue;

            const cIdx = idx * 4;
            const cr = rgbaCopy[cIdx] / 255, cg = rgbaCopy[cIdx + 1] / 255, cb = rgbaCopy[cIdx + 2] / 255;

            const vx = Math.round(worldPt.x * voxInv), vy = Math.round(worldPt.y * voxInv), vz = Math.round(worldPt.z * voxInv);
            const key = `${vx},${vy},${vz}`;
            const existingIdx = xrVoxelToIndex.get(key);

            if (existingIdx !== undefined) {
              const h = Math.min(254, xrHits[existingIdx] + 1);
              xrHits[existingIdx] = h;
              const w = 1 / h;
              xrPositions[existingIdx * 3] += (worldPt.x - xrPositions[existingIdx * 3]) * w;
              xrPositions[existingIdx * 3 + 1] += (worldPt.y - xrPositions[existingIdx * 3 + 1]) * w;
              xrPositions[existingIdx * 3 + 2] += (worldPt.z - xrPositions[existingIdx * 3 + 2]) * w;
              xrColors[existingIdx * 3] += (cr - xrColors[existingIdx * 3]) * w;
              xrColors[existingIdx * 3 + 1] += (cg - xrColors[existingIdx * 3 + 1]) * w;
              xrColors[existingIdx * 3 + 2] += (cb - xrColors[existingIdx * 3 + 2]) * w;
            } else if (xrPtsCount < MAX_XR_PTS) {
              const p = xrPtsCount++;
              xrVoxelToIndex.set(key, p);
              xrHits[p] = 1;
              xrPositions[p * 3] = worldPt.x;
              xrPositions[p * 3 + 1] = worldPt.y;
              xrPositions[p * 3 + 2] = worldPt.z;
              xrColors[p * 3] = cr;
              xrColors[p * 3 + 1] = cg;
              xrColors[p * 3 + 2] = cb;
              added++;
            }
          }
        }

        if (added > 0 || xrPtsCount > 0) {
          xrGeo.setDrawRange(0, xrPtsCount);
          xrPosAttr.needsUpdate = true;
          xrColAttr.needsUpdate = true;
        }
        xrAiJobsDone++;
      }

      // Fallback pure WebXR Depth slice if camera-access unavailable or user switches mode
      function insertRawXRDepthSlice(depthInfo, view, hasColor, scaleMul) {
        invProj.fromArray((depthInfo.projectionMatrix) || view.projectionMatrix).invert();
        const isObj = state.scanMode === 'object';
        const minDist = isObj ? 0.14 : 0.40;
        const maxDist = isObj ? 1.6 : parseFloat(document.getElementById('rngXrMaxDist').value);
        const colsN = 40, rowsN = 30, voxInv = isObj ? 100 : 34;

        const dGrid = new Float32Array(colsN * rowsN);
        for (let r = 0; r < rowsN; r++) {
          const ny = (r + 0.5) / rowsN;
          for (let c = 0; c < colsN; c++) {
            const d = depthInfo.getDepthInMeters((c + 0.5) / colsN, ny);
            dGrid[r * colsN + c] = (d && d > 0.05) ? d * scaleMul : 0;
          }
        }
        for (let r = 1; r < rowsN - 1; r++) {
          const ny = (r + 0.5) / rowsN;
          for (let c = 1; c < colsN - 1; c++) {
            const nx = (c + 0.5) / colsN, idx = r * colsN + c, distM = dGrid[idx];
            if (distM < minDist || distM > maxDist) continue;
            const dl = dGrid[idx - 1], dr = dGrid[idx + 1], du = dGrid[idx - colsN], dd = dGrid[idx + colsN];
            if (!dl || !dr || !du || !dd) continue;
            if (Math.abs(distM - dl) / distM > 0.07 || Math.abs(distM - dr) / distM > 0.07 ||
                Math.abs(distM - du) / distM > 0.07 || Math.abs(distM - dd) / distM > 0.07) continue;

            rayVec.set(2 * nx - 1, 1 - 2 * ny, -1).applyMatrix4(invProj);
            const iz = -rayVec.z; if (iz <= 1e-4) continue;
            worldPt.set((rayVec.x / iz) * distM, (rayVec.y / iz) * distM, -distM).applyMatrix4(viewMat);

            let cr, cg, cb;
            if (hasColor) {
              const cx = Math.min(fboW - 1, Math.floor(nx * fboW)), cy = Math.min(fboH - 1, Math.floor(ny * fboH));
              const pIdx = (cy * fboW + cx) * 4;
              cr = topDownRgba[pIdx] / 255; cg = topDownRgba[pIdx + 1] / 255; cb = topDownRgba[pIdx + 2] / 255;
            } else {
              [cr, cg, cb] = depthToHeatColor(1 - Math.min(1, distM / maxDist));
            }
            const vx = Math.round(worldPt.x * voxInv), vy = Math.round(worldPt.y * voxInv), vz = Math.round(worldPt.z * voxInv);
            const key = `${vx},${vy},${vz}`;
            if (!xrVoxelToIndex.has(key) && xrPtsCount < MAX_XR_PTS) {
              const p = xrPtsCount++;
              xrVoxelToIndex.set(key, p); xrHits[p] = 1;
              xrPositions[p * 3] = worldPt.x; xrPositions[p * 3 + 1] = worldPt.y; xrPositions[p * 3 + 2] = worldPt.z;
              xrColors[p * 3] = cr; xrColors[p * 3 + 1] = cg; xrColors[p * 3 + 2] = cb;
            }
          }
        }
        xrGeo.setDrawRange(0, xrPtsCount);
        xrPosAttr.needsUpdate = true; xrColAttr.needsUpdate = true;
      }

      xrSession.addEventListener('end', () => {
        renderer.setAnimationLoop(null);
        renderer.xr.enabled = false;
        gridHelper.visible = true;
        document.getElementById('xrOverlay').classList.remove('active');
        document.getElementById('topbar').style.display = 'flex';
        pipCanvas.style.display = 'none';
        xrSession = null;
        xrHitTestSource = null;
        ensureDetectorMode('VIDEO');

        configureViewerPanels('xr');
        if (xrPtsCount > 0) {
          let sx = 0, sy = 0, sz = 0;
          for (let i = 0; i < xrPtsCount; i++) {
            sx += xrPositions[i * 3]; sy += xrPositions[i * 3 + 1]; sz += xrPositions[i * 3 + 2];
          }
          const cx = sx / xrPtsCount, cy = sy / xrPtsCount, cz = sz / xrPtsCount;
          for (let i = 0; i < xrPtsCount; i++) {
            xrPositions[i * 3] -= cx; xrPositions[i * 3 + 1] -= cy; xrPositions[i * 3 + 2] -= cz;
          }
          xrPosAttr.needsUpdate = true;
          xrGeo.computeBoundingSphere();

          if (state.scanMode === 'object' && xrPtsCount >= 80) {
            buildSurfaceNetsMeshFromXR(1);
            camera.position.set(0, 0.25, 0.9);
          } else {
            camera.position.set(0, 0.5, 2.0);
          }
          controls.target.set(0, 0, 0);
          controls.update();
          onViewerResize();
          switchTab('viewer');
        } else {
          switchTab('scanner');
        }
        startViewerRenderLoop();
      });

      renderer.setAnimationLoop((time, frame) => {
        renderer.render(scene, camera);
        if (!frame) return;

        const refSpace = renderer.xr.getReferenceSpace();
        const pose = refSpace ? frame.getViewerPose(refSpace) : null;
        if (!pose || pose.views.length === 0) return;

        const view = pose.views[0];
        const depthInfo = frame.getDepthInformation(view);
        viewMat.fromArray((depthInfo?.transform?.matrix) || view.transform.matrix);
        viewMat.decompose(camPos, camQuat, new THREE.Vector3());

        const scaleMul = parseFloat(document.getElementById('rngXrScale').value);

        // Hit-test center distance
        let hitDist = null;
        if (xrHitTestSource) {
          const hits = frame.getHitTestResults(xrHitTestSource);
          if (hits.length > 0) {
            const hp = hits[0].getPose(refSpace);
            if (hp) {
              const p = hp.transform.position;
              hitDist = camPos.distanceTo(new THREE.Vector3(p.x, p.y, p.z));
            }
          }
        }

        // Center ARCore depth
        let xrCenterD = 0;
        if (depthInfo) {
          xrCenterD = depthInfo.getDepthInMeters(0.5, 0.5) || 0;
        }

        // Update HUD status
        if (time - lastHudUpdate > 160) {
          lastHudUpdate = time;
          const aiTxt = state.aiReady
            ? (xrAiBusy ? '<span class="warn">AI解析中...</span>' : `<span class="ok">AI準備OK(${state.aiBackend})</span>`)
            : `<span class="warn">AI読込${state.aiProgress}%</span>`;
          const lockTxt = xrLockedTarget ? `<span class="ok">🎯${xrLockedTarget.label}</span>` : '全体/タップで切抜';
          const distStr = hitDist ? `${hitDist.toFixed(2)}m(Hit)` : (xrCenterD > 0 ? `${xrCenterD.toFixed(2)}m` : '--');
          document.getElementById('xrStatus').innerHTML =
            `${aiTxt} | 基準: <strong>${distStr}</strong><br>` +
            `${lockTxt} | 回数:${xrAiJobsDone} | 点:<strong>${xrPtsCount.toLocaleString()}</strong>`;
        }

        // Periodic MediaPipe Object Detection on AR Camera Image (~350ms)
        const needCamRead = (time - lastDetTime > 360) || xrPendingSnap || (xrAutoCapture && !xrAiBusy);
        let hasCamPixels = false;
        if (needCamRead) {
          hasCamPixels = grabUprightCameraPixels(view);
          if (hasCamPixels) {
            mpCtx.putImageData(new ImageData(topDownRgba, fboW, fboH), 0, 0);
            if (pipCanvas.style.display !== 'block') pipCanvas.style.display = 'block';
            pipCtx.drawImage(mpCanvas, 0, 0, pipCanvas.width, pipCanvas.height);

            if (time - lastDetTime > 360 && state.detector && state.detectorMode === 'IMAGE') {
              lastDetTime = time;
              try {
                const res = state.detector.detect(mpCanvas);
                xrDetections = (res.detections || []).map(d => {
                  const cat = d.categories?.[0] || { categoryName: 'object', score: 0.5 };
                  const b = d.boundingBox;
                  return {
                    label: cat.categoryName, score: cat.score,
                    boxNorm: {
                      xmin: Math.max(0, b.originX / fboW), ymin: Math.max(0, b.originY / fboH),
                      xmax: Math.min(1, (b.originX + b.width) / fboW), ymax: Math.min(1, (b.originY + b.height) / fboH)
                    }
                  };
                });
                drawXROverlayHUD();
              } catch (e) {}
            }
          }
        }

        // Check if we should trigger Hybrid AI Scan (or Raw Depth fallback)
        const movedDist = hasLastCapPose ? camPos.distanceTo(lastCapCamPos) : 999;
        const rotatedDeg = hasLastCapPose ? THREE.MathUtils.radToDeg(camQuat.angleTo(lastCapCamQuat)) : 999;
        const motionReady = movedDist >= 0.10 || rotatedDeg >= 14.0;
        const triggerScan = xrPendingSnap || (xrAutoCapture && !xrAiBusy && motionReady && (time - lastScanTriggerTime > 450));

        if (triggerScan) {
          xrPendingSnap = false;
          if (!state.xrUseHybridAI || !hasCamPixels || !state.aiReady) {
            if (depthInfo) {
              if (!state.aiReady && state.xrUseHybridAI) {
                showToast(`AI準備中のため暫定AR深度で記録 (AI ${state.aiProgress}%)`, 1500);
              }
              insertRawXRDepthSlice(depthInfo, view, hasCamPixels, scaleMul);
              lastCapCamPos.copy(camPos); lastCapCamQuat.copy(camQuat); hasLastCapPose = true;
            }
          } else if (!xrAiBusy) {
            xrAiBusy = true;
            lastScanTriggerTime = time;
            lastCapCamPos.copy(camPos); lastCapCamQuat.copy(camQuat); hasLastCapPose = true;

            // Collect 7x7 ARCore depth samples for scale calibration (excluding sharp depth jumps)
            const depthSamples = [];
            if (depthInfo) {
              for (let sy = 1; sy <= 7; sy++) {
                for (let sx = 1; sx <= 7; sx++) {
                  const nx = sx / 8, ny = sy / 8;
                  const d = depthInfo.getDepthInMeters(nx, ny);
                  if (d > 0.20 && d < 6.5) depthSamples.push({ nx, ny, xrDistM: d });
                }
              }
            }

            // Latch exact pose, projection matrix, and RGBA snapshot!
            const latch = {
              gw: fboW, gh: fboH,
              rgbaCopy: new Uint8ClampedArray(topDownRgba),
              capturedViewMat: viewMat.clone(),
              capturedProjMat: new Float32Array((depthInfo?.projectionMatrix) || view.projectionMatrix),
              depthSamples,
              hitDist,
              scaleMul,
              targetSnap: xrLockedTarget ? JSON.parse(JSON.stringify(xrLockedTarget)) : null,
              scanModeSnap: state.scanMode
            };

            inferDepth(latch.rgbaCopy, fboW, fboH)
              .then(aiRes => {
                if (xrSession) insertHybridAISlice(aiRes, latch);
              })
              .catch(err => console.warn('Hybrid AI depth err:', err))
              .finally(() => { xrAiBusy = false; });
          }
        }
      });
    }

    document.getElementById('btnStartWebXRDirect').addEventListener('click', startWebXRLiDAR);

    function downloadBlob(blob, name) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    function buildCleanExportObject() {
      if (state.viewMode === 'xr' && !state.xrBuiltMesh) {
        const mh = parseInt(document.getElementById('rngMinHits').value, 10);
        const pos = [], col = [];
        for (let i = 0; i < xrPtsCount; i++) {
          if (xrHits[i] < mh) continue;
          pos.push(xrPositions[i * 3], xrPositions[i * 3 + 1], xrPositions[i * 3 + 2]);
          col.push(xrColors[i * 3], xrColors[i * 3 + 1], xrColors[i * 3 + 2]);
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
        const grp = new THREE.Group();
        grp.add(new THREE.Points(g, xrPointsMat));
        return { grp, temp: true };
      }
      if (state.viewMode === 'multi') return { grp: multiCloudGroup, temp: false };
      return { grp: modelGroup, temp: false };
    }

    document.getElementById('btnExportGLB').addEventListener('click', async () => {
      const { grp, temp } = buildCleanExportObject();
      if (grp.children.length === 0) { showToast('先にスキャンしてください'); return; }
      showToast('GLB生成中...');
      const exporter = new GLTFExporter();
      const glb = await exporter.parseAsync(grp, { binary: true });
      if (temp) clearGroup(grp);
      downloadBlob(new Blob([glb], { type: 'model/gltf-binary' }), `lidar-hybrid-${state.scanMode}-${Date.now()}.glb`);
      showToast('GLBを保存しました！');
    });

    document.getElementById('btnExportPLY').addEventListener('click', () => {
      const { grp, temp } = buildCleanExportObject();
      if (grp.children.length === 0) { showToast('先にスキャンしてください'); return; }
      const verts = [], faces = [];
      let vOff = 0;
      for (const ch of grp.children) {
        const pos = ch.geometry?.getAttribute('position');
        const col = ch.geometry?.getAttribute('color');
        const idx = ch.geometry?.getIndex();
        if (!pos) continue;
        for (let i = 0; i < pos.count; i++) {
          const r = col ? Math.round(col.getX(i) * 255) : 0;
          const g = col ? Math.round(col.getY(i) * 255) : 240;
          const b = col ? Math.round(col.getZ(i) * 255) : 255;
          verts.push(`${pos.getX(i).toFixed(4)} ${pos.getY(i).toFixed(4)} ${pos.getZ(i).toFixed(4)} ${r} ${g} ${b}`);
        }
        if (idx && ch.isMesh) {
          for (let i = 0; i < idx.count; i += 3) {
            faces.push(`3 ${idx.getX(i) + vOff} ${idx.getX(i + 1) + vOff} ${idx.getX(i + 2) + vOff}`);
          }
        }
        vOff += pos.count;
      }
      if (temp) clearGroup(grp);
      const hdr = [
        'ply', 'format ascii 1.0', `element vertex ${verts.length}`,
        'property float x', 'property float y', 'property float z',
        'property uchar red', 'property uchar green', 'property uchar blue',
        ...(faces.length ? [`element face ${faces.length}`, 'property list uchar int vertex_indices'] : []),
        'end_header'
      ].join('\n');
      downloadBlob(new Blob([hdr + '\n' + verts.join('\n') + (faces.length ? '\n' + faces.join('\n') : '')], { type: 'text/plain' }), `lidar-hybrid-${state.scanMode}-${Date.now()}.ply`);
      showToast('PLYを保存しました！');
    });

    function startViewerRenderLoop() {
      renderer.setAnimationLoop(() => {
        if (viewerView.classList.contains('active') && !renderer.xr.isPresenting) {
          if (state.gyroOrbit && state.gyroAvailable) {
            modelGroup.quaternion.slerp(getRelativeWorldQuat().invert(), 0.15);
          } else {
            modelGroup.quaternion.slerp(new THREE.Quaternion(), 0.15);
          }
          controls.update();
          renderer.render(scene, camera);
        }
      });
    }
    startViewerRenderLoop();
  </script>
</body>
</html>
