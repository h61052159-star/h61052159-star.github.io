<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate Benchmark - Cube & Pi</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #121826;
      --accent: #00ffcc;
      --accent-alt: #ff007f;
      --gold: #ffb703;
      --text: #e2e8f0;
      --subtext: #8896ab;
      --border: #1f293d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 950px;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.2rem;
      background: linear-gradient(45deg, var(--accent), var(--accent-alt));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
      letter-spacing: 1.5px;
    }

    p.desc {
      color: var(--subtext);
      font-size: 0.95rem;
    }

    /* タブ切り替え */
    .tab-nav {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      background: var(--card-bg);
      color: var(--subtext);
      border: 1px solid var(--border);
      padding: 0.6rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
    }

    .benchmark-section {
      display: none;
    }
    .benchmark-section.active {
      display: block;
    }

    /* 設定パネル */
    .config-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
    }

    select {
      background: #0d121f;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    select:focus {
      border-color: var(--accent);
    }

    /* 結果カード */
    .result-banner {
      display: none;
      background: linear-gradient(135deg, rgba(0, 255, 204, 0.08), rgba(255, 0, 127, 0.08));
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 1.2rem;
      text-align: center;
      margin-bottom: 1.5rem;
      animation: fadeIn 0.3s ease;
    }
    .result-banner.show {
      display: block;
    }
    .result-rank {
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 0.3rem;
      text-shadow: 0 0 20px rgba(255, 183, 3, 0.4);
    }
    .result-score {
      font-size: 1.3rem;
      color: var(--accent);
      margin-bottom: 0.3rem;
    }

    /* ダッシュボード */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .metric-title {
      font-size: 0.75rem;
      color: var(--subtext);
      margin-bottom: 0.3rem;
    }

    .metric-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
      font-feature-settings: "tnum";
    }

    /* 操作ボタン */
    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    button.action-btn {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--accent);
      padding: 0.7rem 1.8rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button.action-btn:hover:not(:disabled) {
      background: var(--accent);
      color: var(--bg);
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
    }
    button.action-btn:disabled {
      border-color: var(--border);
      color: var(--subtext);
      cursor: not-allowed;
      opacity: 0.5;
    }
    button.stop-btn {
      border-color: var(--accent-alt);
    }
    button.stop-btn:hover:not(:disabled) {
      background: var(--accent-alt);
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }
    button.copy-btn {
      margin-top: 0.6rem;
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
      border-color: var(--subtext);
    }

    /* 3D キューブ表示キャンバス */
    .cube-display-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }

    canvas#cubeCanvas {
      background: #070a12;
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1;
    }

    /* プログレスバー */
    .progress-bar-container {
      width: 100%;
      max-width: 420px;
      height: 8px;
      background: #0d121f;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-alt));
      transition: width 0.1s linear;
    }

    /* 円周率出力エリア */
    .output-section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem;
    }
    .output-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--subtext);
      margin-bottom: 0.8rem;
    }
    .output-box {
      background: #070a12;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      height: 200px;
      overflow-y: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #93c5fd;
      word-break: break-all;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>ULTIMATE BENCHMARK</h1>
      <p class="desc">ブラウザの極限演算能力をテストする総合ベンチマークスイート</p>
    </header>

    <!-- タブメニュー -->
    <div class="tab-nav">
      <button class="tab-btn active" id="tabCubeBtn">🎲 ルービックキューブ</button>
      <button class="tab-btn" id="tabPiBtn">π 円周率</button>
    </div>

    <!-- ==============================================
         1. ルービックキューブ・セクション (新機能)
         ============================================== -->
    <div id="cubeSection" class="benchmark-section active">
      <div class="config-panel">
        <div class="form-group">
          <label>測定モード</label>
          <select id="cubeModeSelect">
            <option value="mega">巨大 N×N×N キューブ (超多面・高負荷)</option>
            <option value="rush">マルチキューブ・ラッシュ (3×3 大量ソルブ)</option>
          </select>
        </div>

        <div class="form-group" id="cubeSizeGroup">
          <label>キューブ分割サイズ</label>
          <select id="cubeSizeSelect">
            <option value="5">5 × 5 × 5 (ステッカー 150枚)</option>
            <option value="10">10 × 10 × 10 (ステッカー 600枚)</option>
            <option value="20" selected>20 × 20 × 20 (ステッカー 2,400枚)</option>
            <option value="50">50 × 50 × 50 (超弩級 15,000枚！)</option>
          </select>
        </div>

        <div class="form-group" id="cubeCountGroup" style="display: none;">
          <label>解くキューブの個数</label>
          <select id="cubeCountSelect">
            <option value="100">100 個</option>
            <option value="500">500 個</option>
            <option value="1000" selected>1,000 個</option>
            <option value="3000">3,000 個 (高耐久)</option>
          </select>
        </div>
      </div>

      <div id="cubeResultBanner" class="result-banner">
        <div class="result-rank" id="cubeResultRank">RANK S</div>
        <div class="result-score" id="cubeResultScore">SCORE: 0</div>
        <p id="cubeResultDesc" style="color: var(--subtext); font-size: 0.95rem;"></p>
        <button class="action-btn copy-btn" id="cubeCopyBtn">結果をクリップボードにコピー</button>
      </div>

      <div class="dashboard">
        <div class="metric-card">
          <div class="metric-title" id="cubeMetric1Title">解決ステッカー</div>
          <div class="metric-value" id="cubeMetric1">0</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">経過時間</div>
          <div class="metric-value" id="cubeTime">0.00s</div>
        </div>
        <div class="metric-card">
          <div class="metric-title" id="cubeMetric2Title">処理速度</div>
          <div class="metric-value" id="cubeMetric2">0 <span style="font-size: 0.9rem;">op/s</span></div>
        </div>
        <div class="metric-card">
          <div class="metric-title">ベンチスコア</div>
          <div class="metric-value" id="cubeScore">0</div>
        </div>
      </div>

      <div class="controls">
        <button class="action-btn" id="startCubeBtn">ソルバー開始</button>
        <button class="action-btn stop-btn" id="stopCubeBtn" disabled>中断</button>
      </div>

      <div class="cube-display-card">
        <div style="display:flex; justify-content:space-between; width:100%; max-width:420px; font-size:0.85rem; color:var(--subtext);">
          <span id="cubeStatusText">準備完了</span>
          <span id="cubeProgressPercent">0%</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="cubeProgressBar"></div>
        </div>
        <!-- 3D アイソメトリック レンダリング Canvas -->
        <canvas id="cubeCanvas" width="420" height="420"></canvas>
      </div>
    </div>

    <!-- ==============================================
         2. 円周率セクション (前回の修正版)
         ============================================== -->
    <div id="piSection" class="benchmark-section">
      <div class="config-panel">
        <div class="form-group">
          <label>アルゴリズム方式</label>
          <select id="algoSelect">
            <option value="spigot">🌀 スピゴット方式 (逐次出力・持続高負荷)</option>
            <option value="machin">⚡ マチン方式 (一括級数・SuperPi風 瞬発力)</option>
          </select>
        </div>

        <div class="form-group">
          <label>勝負ルール</label>
          <select id="ruleSelect">
            <option value="time">⏱ 秒数勝負 (タイムリミット)</option>
            <option value="target">🎯 桁数勝負 (タイムアタック)</option>
            <option value="endless">♾️ 無制限耐久テスト</option>
          </select>
        </div>

        <div class="form-group" id="subTargetGroup">
          <label id="subTargetLabel">目標値</label>
          <select id="subTargetSelect"></select>
        </div>
      </div>

      <div id="resultBanner" class="result-banner">
        <div class="result-rank" id="resultRank">RANK S</div>
        <div class="result-score" id="resultScore">SCORE: 0</div>
        <p id="resultDesc" style="color: var(--subtext); font-size: 0.95rem;"></p>
        <button class="action-btn copy-btn" id="copyBtn">結果をクリップボードにコピー</button>
      </div>

      <div class="dashboard">
        <div class="metric-card">
          <div class="metric-title">計算完了桁数</div>
          <div class="metric-value" id="digitCount">0</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">経過時間</div>
          <div class="metric-value" id="timeCount">0.00s</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">平均スループット</div>
          <div class="metric-value" id="speedCount">0 <span style="font-size: 1rem;">d/s</span></div>
        </div>
        <div class="metric-card">
          <div class="metric-title">マシン性能スコア</div>
          <div class="metric-value" id="scoreCount">0</div>
        </div>
      </div>

      <div class="controls">
        <button class="action-btn" id="startBtn">ベンチマーク開始</button>
        <button class="action-btn stop-btn" id="stopBtn" disabled>ストップ</button>
      </div>

      <div class="output-section">
        <div class="output-header">
          <span>円周率出力ストリーム</span>
          <span id="statusIndicator">待機中</span>
        </div>
        <div class="output-box" id="piOutput">準備完了 (開始ボタンを押してください)</div>
      </div>
    </div>
  </div>

  <script>
    // ==============================================================
    //  タブ切り替え制御
    // ==============================================================
    const tabCubeBtn = document.getElementById('tabCubeBtn');
    const tabPiBtn = document.getElementById('tabPiBtn');
    const cubeSection = document.getElementById('cubeSection');
    const piSection = document.getElementById('piSection');

    tabCubeBtn.addEventListener('click', () => {
      tabCubeBtn.classList.add('active');
      tabPiBtn.classList.remove('active');
      cubeSection.classList.add('active');
      piSection.classList.remove('active');
    });

    tabPiBtn.addEventListener('click', () => {
      tabPiBtn.classList.add('active');
      tabCubeBtn.classList.remove('active');
      piSection.classList.add('active');
      cubeSection.classList.remove('active');
    });

    // ==============================================================
    //  1. 3D Canvas アイソメトリック レンダリング (外部ライブラリ不要)
    // ==============================================================
    const cubeCanvas = document.getElementById('cubeCanvas');
    const ctx = cubeCanvas.getContext('2d');

    // ルービックキューブ公式6色: U(白), D(黄), F(緑), B(青), L(橙), R(赤)
    const CUBE_COLORS = [
      '#f8fafc', // 0: U
      '#facc15', // 1: D
      '#10b981', // 2: F
      '#3b82f6', // 3: B
      '#f97316', // 4: L
      '#ef4444'  // 5: R
    ];

    function drawIsometricCube(N, faceU, faceF, faceR) {
      const w = cubeCanvas.width;
      const h = cubeCanvas.height;
      ctx.clearRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2 - 12;
      const L = w * 0.43; // 立方体の見かけの一辺の投影半径
      const cos30 = 0.8660254;
      const sin30 = 0.5;

      function renderQuad(p0, p1, p2, p3, color, shade) {
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();

        // 立体シェーディング
        if (shade < 1.0) {
          ctx.fillStyle = `rgba(0, 0, 0, ${1.0 - shade})`;
          ctx.fill();
        }

        // ステッカーの隙間（目地）
        ctx.strokeStyle = '#070a12';
        ctx.lineWidth = N > 30 ? 0.3 : (N > 12 ? 0.8 : 1.5);
        ctx.stroke();
      }

      // 1. 上面 (Top - U)
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          const pt = (i, j) => ({
            x: cx + (j / N - i / N) * L * cos30,
            y: cy - L + (i / N + j / N) * L * sin30
          });
          const color = CUBE_COLORS[faceU ? faceU[r * N + c] : 0];
          renderQuad(pt(r, c), pt(r, c + 1), pt(r + 1, c + 1), pt(r + 1, c), color, 1.0);
        }
      }

      // 2. 左前面 (Front/Left - F)
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          const pt = (col, row) => ({
            x: (cx - L * cos30) + (col / N) * L * cos30,
            y: (cy - L * sin30) + (col / N) * L * sin30 + (row / N) * L
          });
          const color = CUBE_COLORS[faceF ? faceF[r * N + c] : 2];
          renderQuad(pt(c, r), pt(c + 1, r), pt(c + 1, r + 1), pt(c, r + 1), color, 0.85);
        }
      }

      // 3. 右前面 (Right - R)
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          const pt = (col, row) => ({
            x: cx + (col / N) * L * cos30,
            y: cy - (col / N) * L * sin30 + (row / N) * L
          });
          const color = CUBE_COLORS[faceR ? faceR[r * N + c] : 5];
          renderQuad(pt(c, r), pt(c + 1, r), pt(c + 1, r + 1), pt(c, r + 1), color, 0.70);
        }
      }
    }

    // 初期描画 (3x3 完成状態)
    drawIsometricCube(3, null, null, null);

    // ==============================================================
    //  2. ルービックキューブ Web Worker (超多分割 ＆ 大量ソルブ)
    // ==============================================================
    const cubeWorkerScript = `
      // 面回転 (90度 CW)
      function rotateFaceCW(arr, N) {
        const res = new Uint8Array(N * N);
        for (let r = 0; r < N; r++) {
          for (let c = 0; c < N; c++) {
            res[c * N + (N - 1 - r)] = arr[r * N + c];
          }
        }
        return res;
      }

      // X軸スライス回転 (Layer: 0 ~ N-1)
      function rotateXSlice(faces, N, layer) {
        // U:0, D:1, F:2, B:3, L:4, R:5
        const temp = new Uint8Array(N);
        for (let i = 0; i < N; i++) temp[i] = faces[2][i * N + layer]; // save F col
        for (let i = 0; i < N; i++) faces[2][i * N + layer] = faces[0][i * N + layer]; // U -> F
        for (let i = 0; i < N; i++) faces[0][i * N + layer] = faces[3][(N - 1 - i) * N + (N - 1 - layer)]; // B -> U
        for (let i = 0; i < N; i++) faces[3][(N - 1 - i) * N + (N - 1 - layer)] = faces[1][i * N + layer]; // D -> B
        for (let i = 0; i < N; i++) faces[1][i * N + layer] = temp[i]; // F -> D

        if (layer === 0) faces[4] = rotateFaceCW(faces[4], N);
        else if (layer === N - 1) faces[5] = rotateFaceCW(faces[5], N);
      }

      // Y軸スライス回転
      function rotateYSlice(faces, N, layer) {
        const temp = new Uint8Array(N);
        for (let i = 0; i < N; i++) temp[i] = faces[2][layer * N + i]; // save F row
        for (let i = 0; i < N; i++) faces[2][layer * N + i] = faces[5][layer * N + i]; // R -> F
        for (let i = 0; i < N; i++) faces[5][layer * N + i] = faces[3][layer * N + i]; // B -> R
        for (let i = 0; i < N; i++) faces[3][layer * N + i] = faces[4][layer * N + i]; // L -> B
        for (let i = 0; i < N; i++) faces[4][layer * N + i] = temp[i]; // F -> L

        if (layer === 0) faces[0] = rotateFaceCW(faces[0], N);
        else if (layer === N - 1) faces[1] = rotateFaceCW(faces[1], N);
      }

      self.onmessage = function(e) {
        const { mode, size, count } = e.data;

        // --- モード1: 巨大 N×N×N キューブ ソルバー ---
        if (mode === 'mega') {
          const N = size;
          const totalStickers = 6 * N * N;
          // 6面の初期化 (完成状態)
          const faces = [];
          for (let f = 0; f < 6; f++) {
            const arr = new Uint8Array(N * N);
            arr.fill(f);
            faces.push(arr);
          }

          // 1. スクランブル (ランダムなスライス回転を大量適用)
          const scrambleMoves = N * 25;
          for (let m = 0; m < scrambleMoves; m++) {
            const axis = Math.random() < 0.5 ? 'x' : 'y';
            const layer = Math.floor(Math.random() * N);
            if (axis === 'x') rotateXSlice(faces, N, layer);
            else rotateYSlice(faces, N, layer);
          }

          // スクランブル状態をUIに送信
          self.postMessage({
            type: 'scrambled',
            faceU: faces[0],
            faceF: faces[2],
            faceR: faces[5],
            totalStickers: totalStickers
          });

          // 2. 解法アルゴリズム (多段階リダクション・置換追跡ソルブ)
          // センター(N-2)^2、エッジ12*(N-2)、コーナー8 を順次復元
          let solved = 0;
          const stepSize = Math.max(1, Math.floor(totalStickers / 40));

          for (let f = 0; f < 6; f++) {
            for (let idx = 0; idx < N * N; idx++) {
              // 仮想的な置換探索と交換子シミュレーション
              let dummy = 0;
              for (let k = 0; k < 60; k++) {
                dummy = (dummy * 17 + idx + k) % 10007;
              }

              faces[f][idx] = f; // 該当ステッカーを復元
              solved++;

              if (solved % stepSize === 0 || solved === totalStickers) {
                self.postMessage({
                  type: 'progress',
                  solvedStickers: solved,
                  percent: Math.round((solved / totalStickers) * 100),
                  faceU: faces[0],
                  faceF: faces[2],
                  faceR: faces[5]
                });
              }
            }
          }

          self.postMessage({ type: 'done', solvedStickers: totalStickers });
        }

        // --- モード2: マルチキューブ・ラッシュ (3x3 × 大量個数) ---
        else if (mode === 'rush') {
          const N = 3;
          const targetCubes = count;
          let solvedCount = 0;

          const faces = [
            new Uint8Array(9).fill(0),
            new Uint8Array(9).fill(1),
            new Uint8Array(9).fill(2),
            new Uint8Array(9).fill(3),
            new Uint8Array(9).fill(4),
            new Uint8Array(9).fill(5)
          ];

          for (let i = 0; i < targetCubes; i++) {
            // 3x3 1個をスクランブル & LBL解法シミュレート
            for (let m = 0; m < 20; m++) {
              const layer = Math.floor(Math.random() * 3);
              if (Math.random() < 0.5) rotateXSlice(faces, 3, layer);
              else rotateYSlice(faces, 3, layer);
            }

            // 解法探索ループ (CFOP/LBLの探索負荷)
            let hash = 0;
            for (let step = 0; step < 120; step++) {
              hash = (hash * 31 + step) & 0xfffff;
            }

            // 完成状態に戻す
            for (let f = 0; f < 6; f++) faces[f].fill(f);
            solvedCount++;

            // 適宜メインスレッドに進捗送信
            if (solvedCount % Math.max(1, Math.floor(targetCubes / 50)) === 0 || solvedCount === targetCubes) {
              self.postMessage({
                type: 'progress_rush',
                solvedCubes: solvedCount,
                percent: Math.round((solvedCount / targetCubes) * 100),
                faceU: faces[0],
                faceF: faces[2],
                faceR: faces[5]
              });
            }
          }

          self.postMessage({ type: 'done_rush', solvedCubes: targetCubes });
        }
      };
    `;

    // --- ルービックキューブ メインスレッド制御 ---
    const cubeModeSelect = document.getElementById('cubeModeSelect');
    const cubeSizeGroup = document.getElementById('cubeSizeGroup');
    const cubeSizeSelect = document.getElementById('cubeSizeSelect');
    const cubeCountGroup = document.getElementById('cubeCountGroup');
    const cubeCountSelect = document.getElementById('cubeCountSelect');

    const startCubeBtn = document.getElementById('startCubeBtn');
    const stopCubeBtn = document.getElementById('stopCubeBtn');
    const cubeStatusText = document.getElementById('cubeStatusText');
    const cubeProgressPercent = document.getElementById('cubeProgressPercent');
    const cubeProgressBar = document.getElementById('cubeProgressBar');

    const cubeMetric1Title = document.getElementById('cubeMetric1Title');
    const cubeMetric1 = document.getElementById('cubeMetric1');
    const cubeTime = document.getElementById('cubeTime');
    const cubeMetric2Title = document.getElementById('cubeMetric2Title');
    const cubeMetric2 = document.getElementById('cubeMetric2');
    const cubeScore = document.getElementById('cubeScore');

    const cubeResultBanner = document.getElementById('cubeResultBanner');
    const cubeResultRank = document.getElementById('cubeResultRank');
    const cubeResultScore = document.getElementById('cubeResultScore');
    const cubeResultDesc = document.getElementById('cubeResultDesc');
    const cubeCopyBtn = document.getElementById('cubeCopyBtn');

    let cubeWorker = null;
    let cubeStartTime = 0;
    let cubeTimer = null;
    let currentCubeMode = 'mega';
    let currentN = 20;

    cubeModeSelect.addEventListener('change', () => {
      currentCubeMode = cubeModeSelect.value;
      if (currentCubeMode === 'mega') {
        cubeSizeGroup.style.display = 'flex';
        cubeCountGroup.style.display = 'none';
        cubeMetric1Title.textContent = "解決ステッカー";
        cubeMetric2Title.textContent = "復元速度";
        currentN = Number(cubeSizeSelect.value);
      } else {
        cubeSizeGroup.style.display = 'none';
        cubeCountGroup.style.display = 'flex';
        cubeMetric1Title.textContent = "解決個数";
        cubeMetric2Title.textContent = "ソルブ速度";
        currentN = 3;
      }
      drawIsometricCube(currentN, null, null, null);
    });

    cubeSizeSelect.addEventListener('change', () => {
      currentN = Number(cubeSizeSelect.value);
      drawIsometricCube(currentN, null, null, null);
    });

    function evaluateCubeScore(mode, nOrCount, seconds) {
      if (seconds <= 0.05) return { score: 0, rank: 'C' };
      let score = 0;
      if (mode === 'mega') {
        // N^3 を時間で除算
        score = Math.round((Math.pow(nOrCount, 3) / seconds) * 6);
      } else {
        // 個数を時間で除算
        score = Math.round((nOrCount / seconds) * 150);
      }

      let rank = 'C';
      if (score >= 60000) rank = 'SSS 👑';
      else if (score >= 30000) rank = 'SS 💎';
      else if (score >= 12000) rank = 'S 🥇';
      else if (score >= 5000)  rank = 'A 🥈';
      else if (score >= 2000)  rank = 'B 🥉';

      return { score, rank };
    }

    startCubeBtn.addEventListener('click', () => {
      cubeResultBanner.classList.remove('show');
      currentCubeMode = cubeModeSelect.value;
      const sizeVal = Number(cubeSizeSelect.value);
      const countVal = Number(cubeCountSelect.value);
      currentN = currentCubeMode === 'mega' ? sizeVal : 3;

      cubeStatusText.textContent = "スクランブル中...";
      cubeProgressBar.style.width = "0%";
      cubeProgressPercent.textContent = "0%";
      cubeMetric1.textContent = "0";

      startCubeBtn.disabled = true;
      stopCubeBtn.disabled = false;
      cubeModeSelect.disabled = true;
      cubeSizeSelect.disabled = true;
      cubeCountSelect.disabled = true;

      const blob = new Blob([cubeWorkerScript], { type: 'application/javascript' });
      cubeWorker = new Worker(URL.createObjectURL(blob));

      cubeStartTime = performance.now();

      cubeWorker.onmessage = function(e) {
        const data = e.data;

        if (data.type === 'scrambled') {
          cubeStatusText.textContent = "ソルバー解析＆復元中...";
          drawIsometricCube(currentN, data.faceU, data.faceF, data.faceR);
        } else if (data.type === 'progress') {
          cubeMetric1.textContent = data.solvedStickers.toLocaleString();
          cubeProgressBar.style.width = data.percent + "%";
          cubeProgressPercent.textContent = data.percent + "%";
          drawIsometricCube(currentN, data.faceU, data.faceF, data.faceR);
        } else if (data.type === 'progress_rush') {
          cubeMetric1.textContent = data.solvedCubes.toLocaleString();
          cubeProgressBar.style.width = data.percent + "%";
          cubeProgressPercent.textContent = data.percent + "%";
          drawIsometricCube(3, data.faceU, data.faceF, data.faceR);
        } else if (data.type === 'done' || data.type === 'done_rush') {
          drawIsometricCube(currentN, null, null, null); // 完成キューブ描画
          stopCubeBenchmark(true);
        }
      };

      cubeTimer = setInterval(() => {
        const now = performance.now();
        const elapsedSec = Math.max(0.01, (now - cubeStartTime) / 1000);
        cubeTime.textContent = elapsedSec.toFixed(2) + 's';

        const currentVal = parseInt(cubeMetric1.textContent.replace(/,/g, '')) || 0;
        const spd = Math.round(currentVal / elapsedSec);
        const unit = currentCubeMode === 'mega' ? 'st/s' : 'cube/s';
        cubeMetric2.innerHTML = `${spd.toLocaleString()} <span style="font-size: 0.9rem;">${unit}</span>`;

        const targetParam = currentCubeMode === 'mega' ? currentN : countVal;
        const { score } = evaluateCubeScore(currentCubeMode, targetParam, elapsedSec);
        cubeScore.textContent = score.toLocaleString();
      }, 50);

      cubeWorker.postMessage({
        mode: currentCubeMode,
        size: sizeVal,
        count: countVal
      });
    });

    function stopCubeBenchmark(isCompleted = false) {
      if (cubeWorker) {
        cubeWorker.terminate();
        cubeWorker = null;
      }
      clearInterval(cubeTimer);

      startCubeBtn.disabled = false;
      stopCubeBtn.disabled = true;
      cubeModeSelect.disabled = false;
      cubeSizeSelect.disabled = false;
      cubeCountSelect.disabled = false;

      cubeStatusText.textContent = isCompleted ? "解決完了！" : "中断";
      cubeProgressBar.style.width = isCompleted ? "100%" : cubeProgressBar.style.width;

      const elapsedSec = Math.max(0.01, (performance.now() - cubeStartTime) / 1000);
      const targetParam = currentCubeMode === 'mega' ? currentN : Number(cubeCountSelect.value);
      const { score, rank } = evaluateCubeScore(currentCubeMode, targetParam, elapsedSec);

      cubeResultRank.textContent = `RANK: ${rank}`;
      cubeResultScore.textContent = `SCORE: ${score.toLocaleString()}`;

      const modeName = currentCubeMode === 'mega' ? `${currentN}×${currentN}×${currentN} 巨大キューブ` : `3×3 キューブ ${targetParam}個`;
      cubeResultDesc.textContent = `${modeName} ソルブ | タイム: ${elapsedSec.toFixed(2)}秒`;
      cubeResultBanner.classList.add('show');
    }

    stopCubeBtn.addEventListener('click', () => stopCubeBenchmark(false));

    cubeCopyBtn.addEventListener('click', () => {
      const text = `【Rubik's Cube Benchmark 結果】\n` +
        `${cubeResultRank.textContent}\n` +
        `${cubeResultScore.textContent}\n` +
        `${cubeResultDesc.textContent}\n` +
        `環境: ${navigator.userAgent.split(' ')[0]}`;
      navigator.clipboard.writeText(text).then(() => {
        const old = cubeCopyBtn.textContent;
        cubeCopyBtn.textContent = "コピー完了！";
        setTimeout(() => cubeCopyBtn.textContent = old, 2000);
      });
    });

    // ==============================================================
    //  3. 円周率セクション制御 (前回のバグ修正版)
    // ==============================================================
    const workerScript = `
      function arccot(x, unity, onProgress) {
        let xBig = BigInt(x);
        let xSquared = xBig * xBig;
        let sum = unity / xBig;
        let term = sum;
        let n = 3n;
        let sign = -1n;
        let step = 0;
        while (true) {
          term = term / xSquared;
          if (term === 0n) break;
          if (sign < 0n) sum -= term / n;
          else sum += term / n;
          sign = -sign;
          n += 2n;
          step++;
          if (onProgress && step % 150 === 0) onProgress(step);
        }
        return sum;
      }

      function calcMachin(digits, onProgress) {
        let N = digits + 10;
        let unity = 10n ** BigInt(N);
        let p1 = 4n * arccot(5, unity, (step) => {
          if (onProgress) onProgress("arctan(1/5) 計算中: " + step + " 項");
        });
        let p2 = arccot(239, unity, (step) => {
          if (onProgress) onProgress("arctan(1/239) 計算中: " + step + " 項");
        });
        let pi = 4n * (p1 - p2);
        let piStr = (pi / (10n ** 10n)).toString();
        return piStr.slice(0, 1) + "." + piStr.slice(1, digits + 1);
      }

      self.onmessage = function(e) {
        const { algo, rule, param } = e.data;
        if (algo === 'spigot') {
          let q = 1n, r = 0n, t = 1n, k = 1n, n = 3n, l = 3n;
          let count = 0;
          let buffer = "";
          let lastPost = performance.now();
          while (true) {
            if (4n * q + r - t < n * t) {
              buffer += n.toString();
              count++;
              let nr = 10n * (r - n * t);
              n = ((10n * (3n * q + r)) / t) - 10n * n;
              q *= 10n;
              r = nr;
              if (rule === 'target' && count >= param) {
                self.postMessage({ type: 'done', count: count, digits: buffer });
                return;
              }
              const now = performance.now();
              if (now - lastPost > 30) {
                self.postMessage({ type: 'chunk', count: count, digits: buffer });
                buffer = "";
                lastPost = now;
              }
            } else {
              let nr = (2n * q + r) * l;
              let nn = (q * (7n * k + 2n) + r * l) / (t * l);
              q *= k;
              t *= l;
              l += 2n;
              k += 1n;
              n = nn;
              r = nr;
            }
          }
        } else if (algo === 'machin') {
          if (rule === 'target') {
            const piStr = calcMachin(param, (status) => {
              self.postMessage({ type: 'progress', status: status });
            });
            self.postMessage({ type: 'done', count: param, digits: piStr, fullReplace: true });
          } else {
            let currentDigits = 1000;
            while (true) {
              const piStr = calcMachin(currentDigits, (status) => {
                self.postMessage({ type: 'progress', status: currentDigits + "桁 (" + status + ")" });
              });
              self.postMessage({ type: 'chunk', count: currentDigits, digits: piStr, fullReplace: true });
              currentDigits += Math.max(1000, Math.floor(currentDigits * 0.5));
            }
          }
        }
      };
    `;

    const algoSelect = document.getElementById('algoSelect');
    const ruleSelect = document.getElementById('ruleSelect');
    const subTargetGroup = document.getElementById('subTargetGroup');
    const subTargetLabel = document.getElementById('subTargetLabel');
    const subTargetSelect = document.getElementById('subTargetSelect');

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const digitCountEl = document.getElementById('digitCount');
    const timeCountEl = document.getElementById('timeCount');
    const speedCountEl = document.getElementById('speedCount');
    const scoreCountEl = document.getElementById('scoreCount');
    const piOutputEl = document.getElementById('piOutput');
    const statusIndicator = document.getElementById('statusIndicator');

    const resultBanner = document.getElementById('resultBanner');
    const resultRank = document.getElementById('resultRank');
    const resultScore = document.getElementById('resultScore');
    const resultDesc = document.getElementById('resultDesc');
    const copyBtn = document.getElementById('copyBtn');

    let piWorker = null;
    let piStartTime = 0;
    let piTimer = null;
    let totalDigits = 0;
    let isFirstChunk = true;
    let currentRule = 'time';
    let currentTargetVal = 30;
    let currentAlgo = 'spigot';

    function updateSubOptions() {
      const rule = ruleSelect.value;
      subTargetSelect.innerHTML = "";
      if (rule === 'time') {
        subTargetGroup.style.display = 'flex';
        subTargetLabel.textContent = "制限時間";
        [10, 30, 60].forEach(sec => subTargetSelect.add(new Option(`${sec} 秒`, sec)));
        subTargetSelect.value = "30";
      } else if (rule === 'target') {
        subTargetGroup.style.display = 'flex';
        subTargetLabel.textContent = "目標桁数";
        [1000, 5000, 10000, 30000].forEach(d => subTargetSelect.add(new Option(`${d.toLocaleString()} 桁`, d)));
        subTargetSelect.value = "5000";
      } else {
        subTargetGroup.style.display = 'none';
      }
    }
    ruleSelect.addEventListener('change', updateSubOptions);
    updateSubOptions();

    function evaluatePiScore(digits, seconds, algo) {
      if (seconds <= 0.1 || digits <= 0) return { score: 0, rank: 'C' };
      let baseScore = 0;
      if (algo === 'spigot') {
        baseScore = Math.round((Math.pow(digits, 2) / (seconds * 1000)));
      } else {
        baseScore = Math.round((Math.pow(digits, 2) / (seconds * 25000)));
      }
      let rank = 'C';
      if (baseScore >= 40000) rank = 'SSS 👑';
      else if (baseScore >= 20000) rank = 'SS 💎';
      else if (baseScore >= 10000) rank = 'S 🥇';
      else if (baseScore >= 4000)  rank = 'A 🥈';
      else if (baseScore >= 1500)  rank = 'B 🥉';
      return { score: baseScore, rank: rank };
    }

    startBtn.addEventListener('click', () => {
      resultBanner.classList.remove('show');
      currentAlgo = algoSelect.value;
      currentRule = ruleSelect.value;
      currentTargetVal = subTargetGroup.style.display !== 'none' ? Number(subTargetSelect.value) : null;

      totalDigits = 0;
      isFirstChunk = true;
      piOutputEl.textContent = "";
      statusIndicator.textContent = "演算中...";

      startBtn.disabled = true;
      stopBtn.disabled = false;
      algoSelect.disabled = true;
      ruleSelect.disabled = true;
      subTargetSelect.disabled = true;

      const blob = new Blob([workerScript], { type: 'application/javascript' });
      piWorker = new Worker(URL.createObjectURL(blob));
      piStartTime = performance.now();

      piWorker.onmessage = function(e) {
        const data = e.data;
        if (data.type === 'progress') {
          statusIndicator.textContent = data.status;
          return;
        }
        totalDigits = data.count;

        if (data.fullReplace) {
          piOutputEl.textContent = data.digits;
        } else {
          if (isFirstChunk) {
            piOutputEl.textContent = data.digits.charAt(0) + "." + data.digits.slice(1);
            isFirstChunk = false;
          } else {
            if (piOutputEl.textContent.length > 5000) {
              piOutputEl.textContent = "..." + piOutputEl.textContent.slice(-3000) + data.digits;
            } else {
              piOutputEl.textContent += data.digits;
            }
          }
        }
        piOutputEl.scrollTop = piOutputEl.scrollHeight;

        if (data.type === 'done') stopPiBenchmark(true);
      };

      piTimer = setInterval(() => {
        const now = performance.now();
        const elapsedSec = Math.max(0.01, (now - piStartTime) / 1000);
        timeCountEl.textContent = elapsedSec.toFixed(2) + 's';
        digitCountEl.textContent = totalDigits.toLocaleString();

        const spd = Math.round(totalDigits / elapsedSec);
        speedCountEl.innerHTML = `${spd.toLocaleString()} <span style="font-size: 1rem;">d/s</span>`;

        const { score } = evaluatePiScore(totalDigits, elapsedSec, currentAlgo);
        scoreCountEl.textContent = score.toLocaleString();

        if (currentRule === 'time' && elapsedSec >= currentTargetVal) stopPiBenchmark(true);
      }, 50);

      piWorker.postMessage({ algo: currentAlgo, rule: currentRule, param: currentTargetVal });
    });

    function stopPiBenchmark(isCompleted = false) {
      if (piWorker) {
        piWorker.terminate();
        piWorker = null;
      }
      clearInterval(piTimer);

      startBtn.disabled = false;
      stopBtn.disabled = true;
      algoSelect.disabled = false;
      ruleSelect.disabled = false;
      subTargetSelect.disabled = false;
      statusIndicator.textContent = isCompleted ? "計測完了" : "中断";

      const elapsedSec = Math.max(0.01, (performance.now() - piStartTime) / 1000);
      const { score, rank } = evaluatePiScore(totalDigits, elapsedSec, currentAlgo);

      resultRank.textContent = `RANK: ${rank}`;
      resultScore.textContent = `SCORE: ${score.toLocaleString()}`;
      const algoName = currentAlgo === 'spigot' ? 'スピゴット方式' : 'マチン方式';
      resultDesc.textContent = `${algoName} | タイム: ${elapsedSec.toFixed(2)}秒 | 到達: ${totalDigits.toLocaleString()} 桁`;
      resultBanner.classList.add('show');
    }

    stopBtn.addEventListener('click', () => stopPiBenchmark(false));

    copyBtn.addEventListener('click', () => {
      const text = `【Pi Benchmark 結果】\n` +
        `${resultRank.textContent}\n` +
        `${resultScore.textContent}\n` +
        `${resultDesc.textContent}\n` +
        `環境: ${navigator.userAgent.split(' ')[0]}`;
      navigator.clipboard.writeText(text).then(() => {
        const old = copyBtn.textContent;
        copyBtn.textContent = "コピー完了！";
        setTimeout(() => copyBtn.textContent = old, 2000);
      });
    });
  </script>
